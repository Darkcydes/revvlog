/* Everything that differs between a bike and a car lives here rather than in
   scattered `if (type === 'car')` checks, so adding a third type later is a
   matter of adding an entry, not hunting through the screens. */
const VEHICLE_TYPES = {
  motorcycle:{
    label:'Motorcycle', noun:'bike', navLabel:'Bike', screenTitle:'My bike',
    verb:'ridden', rider:'rider',
    brands:['Royal Enfield','Bajaj','TVS','Hero','Honda','Yamaha','KTM','Suzuki','Triumph','Jawa','Harley-Davidson','Kawasaki','BMW','Ducati','Aprilia','Ola','Ather'],
    /* a bike has a reserve tap you physically switch to; a car just lights a lamp,
       so the same litres mean "switch to reserve" on one and "you're on fumes"
       on the other. The maths is identical; only the word changes. */
    reserveLabel:'Reserve', reserveHint:'Litres left when you switch to reserve',
    tyres:[{k:'tyreFront',label:'Front'},{k:'tyreRear',label:'Rear'}],
    suggest:{ tankSize:13, reserve:3, serviceInterval:10000, serviceIntervalMonths:6, tyreFront:29, tyreRear:32 }
  },
  car:{
    label:'Car', noun:'car', navLabel:'Car', screenTitle:'My car',
    verb:'driven', rider:'driver',
    brands:['Maruti Suzuki','Hyundai','Tata','Mahindra','Kia','Toyota','Honda','MG','Skoda','Volkswagen','Renault','Nissan','Jeep','BMW','Mercedes-Benz','Audi'],
    reserveLabel:'Low fuel at', reserveHint:'Litres left when the fuel lamp comes on',
    tyres:[{k:'tyreFL',label:'Front left'},{k:'tyreFR',label:'Front right'},
           {k:'tyreRL',label:'Rear left'},{k:'tyreRR',label:'Rear right'}],
    suggest:{ tankSize:40, reserve:6, serviceInterval:10000, serviceIntervalMonths:12, tyreFL:32, tyreFR:32, tyreRL:30, tyreRR:30 }
  }
};
const vType = v => VEHICLE_TYPES[(v||bike||{}).type] || VEHICLE_TYPES.motorcycle;

/* Named swatches rather than a colour picker: the hex tints the silhouette, and
   a free picker lets you choose something the silhouette disappears against. */
const COLOURS = [
  {name:'Black',hex:'#1A1A1A'},  {name:'White',hex:'#E8E8E6'},
  {name:'Silver',hex:'#B6B8BB'}, {name:'Grey',hex:'#63666A'},
  {name:'Red',hex:'#D32F2F'},    {name:'Orange',hex:'#FF5A3C'},
  {name:'Yellow',hex:'#F2C230'}, {name:'Green',hex:'#2E7D5B'},
  {name:'Blue',hex:'#2B5FD9'},   {name:'Navy',hex:'#22314F'},
  {name:'Maroon',hex:'#6E2233'}, {name:'Brown',hex:'#6B4A2F'}
];

/* Colour is now a free-text field, so map whatever the user typed onto a swatch
   for the little vehicle dot — a whole word match ("Pearl white" -> white). No
   match (or empty) leaves the hex blank and the dot falls back to neutral grey. */
function colourHex(name){
  const s=(name||'').toLowerCase();
  if(!s) return '';
  const hit = COLOURS.find(c=> new RegExp(`\\b${c.name.toLowerCase()}\\b`).test(s));
  return hit ? hit.hex : '';
}

/* Specs start null, not defaulted. Setup collects identity only, so the range
   and service maths has nothing real to run on until the Vehicle screen is
   filled in — and inventing a tank size would be worse than admitting it is
   missing, because the number would look measured. */
function newVehicle(v){
  return Object.assign({
    id:uid(), type:'motorcycle', brand:'', model:'', name:'',
    colour:{name:'',hex:''},
    tankSize:null, reserve:null, avgMileageOverride:null,
    /* the two service clocks — distance and calendar. Either may be left unset;
       tyre pressures are keyed by VEHICLE_TYPES.tyres and start absent. */
    serviceInterval:null, serviceIntervalMonths:null,
    odoBase:null,          // the dial reading you last typed in
    odoSetAt:null,         // when you typed it — anything ridden before is already on it
    lastServiceOdo:0, lastServiceDate:null,
    serviceLog:[],         // [{odo, date, notes}]
    /* optional, all behind "More details" on the vehicle screen */
    reg:'', year:null, engineCC:null, fuelType:'', insuranceDue:null, pucDue:null,
    createdAt:new Date().toISOString()
  }, v||{});
}

/* The two numbers the tank gauge and the odometer cannot be faked without. */
const vehicleReady = v => !!(v && +v.tankSize>0 && v.odoBase!=null);
const vehicleLabel = v => (v && (v.name || [v.brand,v.model].filter(Boolean).join(' '))) || 'Vehicle';

function findVehicle(id){ return vehicles.find(v=>v.id===id) || null; }

/* Swap the active vehicle. Persists whatever is in the working set first, so
   switching mid-edit never drops the tank you just logged. */
function loadVehicle(id){
  if(bike && activeId) persistActive();
  const v = findVehicle(id) || vehicles[0] || null;
  activeId = v ? v.id : null;
  bike = v;
  entries       = activeId ? DB.get(K.vEntries(activeId), []) : [];
  trips         = activeId ? DB.get(K.vTrips(activeId), [])   : [];
  tripSinceFill = activeId ? DB.get(K.vTrip(activeId), 0)     : 0;
  vehiclePhoto  = activeId ? DB.get(K.vPhoto(activeId), null) : null;
  DB.set(K.active, activeId);
}

function persistActive(){
  if(!activeId) return;
  DB.set(K.vEntries(activeId), entries);
  DB.set(K.vTrips(activeId), trips);
  DB.set(K.vTrip(activeId), tripSinceFill);
}

function addVehicle(v){
  const rec = newVehicle(v);
  vehicles.push(rec);
  DB.set(K.vehicles, vehicles);
  if(!activeId) loadVehicle(rec.id);
  track('vehicle_added', { type: rec.type, total: vehicles.length });
  return rec;
}

/* Deleting a vehicle takes its refuels and trips with it — they are only
   meaningful against the vehicle that produced them. */
function removeVehicle(id){
  const i = vehicles.findIndex(v=>v.id===id);
  if(i<0) return;
  if(id===activeId) persistActive();
  vehicles.splice(i,1);
  [K.vEntries(id), K.vTrips(id), K.vTrip(id), K.vPhoto(id)].forEach(k=>DB.del(k));
  DB.set(K.vehicles, vehicles);
  track('vehicle_removed', { total: vehicles.length });
  if(id===activeId) loadVehicle(vehicles[0] ? vehicles[0].id : null);
}

function save(){
  DB.set(K.vehicles, vehicles);
  DB.set(K.settings, settings);
  DB.set(K.active, activeId);
  persistActive();
}

/* ---------- Calculations ---------- */
function calc(){
  /* Guard the whole thing: with no vehicle selected there is nothing to reason
     about, and every consumer already handles zeroes. */
  if(!bike) return calcEmpty();
  const list = sortedEntries();
  const valid = list.filter(e=> e.tripKm>0 && e.litres>0);
  const withMi = valid.map(e=> ({...e, mileage: e.tripKm/e.litres, cpk: e.cost/e.tripKm}));

  const totalSpent   = list.reduce((s,e)=> s + (+e.cost||0), 0);
  const totalDist    = list.reduce((s,e)=> s + (+e.tripKm||0), 0);
  const totalLitres  = list.reduce((s,e)=> s + (+e.litres||0), 0);
  const lifetimeAvg  = totalLitres>0 ? totalDist/totalLitres : 0;
  const avgCpk       = totalDist>0 ? totalSpent/totalDist : 0;

  const mis = withMi.map(e=>e.mileage);
  const best = mis.length? Math.max(...mis):0;
  const worst= mis.length? Math.min(...mis):0;

  const last3 = withMi.slice(-3).map(e=>e.mileage);
  const recentAvg = last3.length ? last3.reduce((a,b)=>a+b,0)/last3.length : lifetimeAvg;
  const latest = withMi.length ? withMi[withMi.length-1].mileage : 0;
  const prev   = withMi.length>1 ? withMi[withMi.length-2].mileage : 0;
  const delta  = latest && prev ? latest - prev : 0;

  const effMi = bike.avgMileageOverride || recentAvg || lifetimeAvg || 0;
  /* Tank size and reserve stay null until the Vehicle screen is filled in.
     `null * n` is 0 rather than NaN, so nothing downstream breaks — but a range
     of zero is still a claim, and `ready` is what the UI gates the gauge on so
     it can say "not set up yet" instead of quietly reading empty. */
  const fullRange    = effMi * (+bike.tankSize||0);
  const reserveRange = effMi * (+bike.reserve||0);

  const remaining = Math.max(0, fullRange - tripSinceFill);
  const tankPct   = fullRange>0 ? Math.min(100, Math.max(0, (remaining/fullRange)*100)) : 0;

  // refill prediction (avg days between fills)
  let predictDays = null, avgGap = null;
  if(list.length>1){
    let gaps=[]; for(let i=1;i<list.length;i++){ gaps.push((new Date(list[i].date)-new Date(list[i-1].date))/86400000); }
    gaps = gaps.filter(g=>g>0);
    if(gaps.length){ avgGap = gaps.reduce((a,b)=>a+b,0)/gaps.length; const since=(Date.now()-new Date(list[list.length-1].date))/86400000; predictDays = Math.max(0, avgGap - since); }
  }

  // fuel economy score (recent vs best; lifetime as baseline)
  let score = 0;
  if(best>0){ score = Math.round(Math.min(100, (recentAvg/best)*100)); }

  // monthly aggregates
  const mMap = {};
  list.forEach(e=>{ const k=monthKey(e.date); (mMap[k]=mMap[k]||{spend:0,dist:0,litres:0}); mMap[k].spend+=+e.cost||0; mMap[k].dist+=+e.tripKm||0; mMap[k].litres+=+e.litres||0; });
  const monthAgg = Object.keys(mMap).sort().slice(-6).map(k=>({ key:k, label:MON[+k.split('-')[1]-1], ...mMap[k] }));

  // odometer: manual baseline + every tank that isn't already on the dial + whatever
  // has been ridden since the last fill
  const odoDist   = list.reduce((s,e)=> s + (countsToOdo(e) ? (+e.tripKm||0) : 0), 0);
  const loggedKm  = odoDist + (+tripSinceFill||0);
  const odo       = Math.max(0, (+bike.odoBase||0) + loggedKm);

  /* Service runs on two clocks at once — distance covered since the last one,
     and time elapsed since it — and whichever runs out first is the one that
     counts. That is how the schedule is actually written in a manual, and a
     vehicle that sits for eight months needs its oil changed regardless of the
     odometer. Either clock can be left unset; only the ones that are set count. */
  const interval  = Math.max(500, +bike.serviceInterval||10000);
  const months    = Math.max(0, +bike.serviceIntervalMonths||0);
  const lastSvc   = Math.max(0, +bike.lastServiceOdo||0);
  const lastSvcDate = bike.lastServiceDate ? new Date(bike.lastServiceDate) : null;
  const dateOK    = !!(lastSvcDate && !isNaN(lastSvcDate));

  const nextSvc   = lastSvc + interval;
  const kmToSvc   = nextSvc - odo;
  const sincesvc  = Math.max(0, odo - lastSvc);
  const kmPct     = Math.min(100, (sincesvc/interval)*100);

  let nextSvcDate = null, daysToSvc = null, sinceSvcDays = null, dayPct = 0;
  if(months>0 && dateOK){
    nextSvcDate = new Date(lastSvcDate);
    nextSvcDate.setMonth(nextSvcDate.getMonth() + months);
    const span   = Math.max(1, Math.round((nextSvcDate - lastSvcDate)/86400000));
    daysToSvc    = Math.ceil((nextSvcDate - Date.now())/86400000);
    sinceSvcDays = Math.max(0, Math.floor((Date.now() - lastSvcDate)/86400000));
    dayPct       = Math.min(100, (sinceSvcDays/span)*100);
  }

  /* the bar and the banner follow whichever clock has less headroom left */
  const svcPct  = Math.max(kmPct, dayPct);
  const svcDue  = kmToSvc <= 0 || (daysToSvc != null && daysToSvc <= 0);
  const svcSoon = !svcDue && (kmToSvc <= SERVICE_WARN_KM || (daysToSvc != null && daysToSvc <= SERVICE_WARN_DAYS));
  const svcBy   = (daysToSvc != null && dayPct > kmPct) ? 'time' : 'distance';

  // rough day estimate to the DISTANCE service, from km/day over the logged history
  let svcDays = null;
  if(kmToSvc>0 && list.length>1){
    const days=(new Date(list[list.length-1].date)-new Date(list[0].date))/86400000;
    const perDay = days>0 ? totalDist/days : 0;
    const est = perDay>0.5 ? Math.round(kmToSvc/perDay) : null;
    if(est!=null && est<=365) svcDays = est;   // beyond a year the estimate is noise
  }

  return { list, withMi, totalSpent, totalDist, totalLitres, lifetimeAvg, avgCpk, best, worst,
           recentAvg, latest, prev, delta, effMi, fullRange, reserveRange, remaining, tankPct,
           predictDays, avgGap, score, months:monthAgg, count:list.length, ready:vehicleReady(bike),
           odo, odoDist, loggedKm, interval, svcMonths:months, lastSvc, lastSvcDate:dateOK?lastSvcDate:null,
           nextSvc, nextSvcDate, kmToSvc, daysToSvc, sincesvc, sinceSvcDays,
           kmPct, dayPct, svcPct, svcDue, svcSoon, svcBy, svcDays };
}

/** The same shape, all zeroed, for when there is no vehicle to reason about.
    Returning this rather than null means no caller needs a null check. */
function calcEmpty(){
  return { list:[], withMi:[], totalSpent:0, totalDist:0, totalLitres:0, lifetimeAvg:0, avgCpk:0,
           best:0, worst:0, recentAvg:0, latest:0, prev:0, delta:0, effMi:0, fullRange:0,
           reserveRange:0, remaining:0, tankPct:0, predictDays:null, avgGap:null, score:0,
           months:[], count:0, ready:false, odo:0, odoDist:0, loggedKm:0, interval:10000,
           svcMonths:0, lastSvc:0, lastSvcDate:null, nextSvc:0, nextSvcDate:null,
           kmToSvc:0, daysToSvc:null, sincesvc:0, sinceSvcDays:null,
           kmPct:0, dayPct:0, svcPct:0, svcDue:false, svcSoon:false, svcBy:'distance', svcDays:null };
}

/* ---------- Trip economics ---------- */
function latestPricePerLitre(){
  const l = sortedEntries();
  for(let i=l.length-1;i>=0;i--){
    const e=l[i], p = +e.pricePerLitre || (e.litres>0 ? e.cost/e.litres : 0);
    if(p>0) return p;
  }
  return 0;
}
/** Everything a trip detail view needs, with actuals preferred over estimates. */
function tripCalc(t, cached){
  const c = cached || calc();
  const km = +t.distanceKm||0;
  const litres = +t.litres>0 ? +t.litres : (c.effMi>0 ? km/c.effMi : 0);
  const litresActual = +t.litres>0;
  const ppl = latestPricePerLitre();
  const fuelCost = +t.fuelCost>0 ? +t.fuelCost : (litres>0 && ppl>0 ? litres*ppl : 0);
  const fuelActual = +t.fuelCost>0;
  const otherCost = +t.otherCost||0;
  const totalCost = fuelCost + otherCost;
  const mileage = (litresActual && litres>0) ? km/litres : c.effMi;
  const mins = +t.durationMins||0;
  const avgSpeed = mins>0 ? km/(mins/60) : 0;
  const cpk = km>0 ? totalCost/km : 0;
  let days = 1;
  if(t.endDate){ days = Math.max(1, Math.round((new Date(t.endDate)-new Date(t.date))/86400000)+1); }
  return { km, litres, litresActual, ppl, fuelCost, fuelActual, otherCost, totalCost, mileage, mins, avgSpeed, cpk, days, effMi:c.effMi };
}
function tripTotals(cached){
  const c = cached || calc();
  const km = trips.reduce((s,t)=> s+(+t.distanceKm||0), 0);
  const spend = trips.reduce((s,t)=> s + tripCalc(t,c).totalCost, 0);
  const mins = trips.reduce((s,t)=> s+(+t.durationMins||0), 0);
  const longest = trips.reduce((m,t)=> Math.max(m,+t.distanceKm||0), 0);
  return { count:trips.length, km, spend, mins, longest };
}

/* ==================================================================
   Charts — four forms, all tappable
     bars()   capsule columns on a date scale      (mileage, spend, distance)
     dots()   value dots riding on grey tracks     (scores, ratings)
     spread() min–max capsules with a callout      (price range per month)
     line()   trend line with a gradient wash      (cost per km)
   Every point is {label, display, sub, value}; geometry is cached in
   CHARTS so the tap handler can place a tooltip without re-measuring.
   ================================================================== */
const CHARTS = {};
let chartSeq = 0, chartPinned = false, pinnedAt = 0;

function chartId(meta){ const id='ch'+(++chartSeq); CHARTS[id]=meta; return id; }
function pruneCharts(){ Object.keys(CHARTS).forEach(k=>{ if(!document.querySelector(`[data-chart="${k}"]`)) delete CHARTS[k]; }); }
const chartAria=(title,pts)=> esc(`${title||'Chart'}: ${pts.length} points. Use arrow keys to read each value.`);
const noData = t => `<div class="empty-chart">${esc(t||'Not enough data yet')}</div>`;
/* viewBox widths chosen to sit near 1:1 with the rendered CSS width, so bar
   thickness and axis type stay legible instead of being scaled down. */
const MINI_W = 165;

/** Wraps any chart body in the interactive shell. */
function frame(id, title, pts, svg){
  return `<div class="chart-inter" data-chart="${id}" tabindex="0" role="group" aria-label="${chartAria(title,pts)}">
    ${svg}<div class="ch-tip" aria-hidden="true"></div><span class="sr-only" aria-live="polite"></span>
  </div>`;
}
const axisLabels = (pts,n) => pts.map((p,i)=>
  `<text class="ch-lab${i===n-1?' last':''}" x="${p.x.toFixed(1)}" y="${p.y}" text-anchor="middle">${esc(p.t)}</text>`).join('');

/* ---------- capsule columns ---------- */
function bars(points, opt={}){
  if(!points.length) return noData(opt.empty);
  const w=opt.w||320, h=opt.h||120, labelH=opt.labels===false?4:20, topPad=opt.topPad||14;
  const color=opt.color||'var(--c-eco)';
  const n=points.length, step=w/n;
  const bw=Math.max(6, Math.min(opt.bw||15, step*0.58));
  const max=Math.max(...points.map(p=>+p.value||0), opt.min||0, 1);
  const plot=h-labelH-topPad;
  const px=[], py=[], labs=[];
  const body=points.map((p,i)=>{
    const bh=Math.max(bw, ((+p.value||0)/max)*plot);
    const cx=step*i+step/2, y=h-labelH-bh;
    px.push(cx); py.push(y);
    if(labelH>4) labs.push({x:cx, y:h-3, t:p.label});
    return `<rect data-bar="${i}" class="${i===n-1?'on':''}" x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}"
      width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="${(bw/2).toFixed(1)}" fill="${color}"/>`;
  }).join('');
  const hits=points.map((p,i)=>`<rect class="hit" x="${(step*i).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${h}" rx="7" data-pt="${i}" aria-hidden="true"></rect>`).join('');
  const id=chartId({type:'bar', points, px, py, vbW:w, vbH:h});
  return frame(id, opt.title, points,
    `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true">${body}${axisLabels(labs,n)}${hits}</svg>`);
}

/* ---------- value dots on grey tracks ---------- */
function dots(points, opt={}){
  if(!points.length) return noData(opt.empty);
  const w=opt.w||320, h=opt.h||120, labelH=opt.labels===false?4:20, pad=8;
  const n=points.length, step=w/n;
  const tw=Math.max(7, Math.min(13, step*0.42)), r=tw*0.52;
  const lo=opt.lo!=null?opt.lo:Math.min(...points.map(p=>+p.value||0));
  const hi=opt.hi!=null?opt.hi:Math.max(...points.map(p=>+p.value||0));
  const span=(hi-lo)||1;
  const plotT=pad, plotB=h-labelH-pad;
  const px=[], py=[], labs=[];
  const body=points.map((p,i)=>{
    const cx=step*i+step/2;
    const cy=plotB-((((+p.value||0)-lo)/span)*(plotB-plotT));
    px.push(cx); py.push(cy);
    if(labelH>4) labs.push({x:cx, y:h-3, t:p.label});
    return `<rect x="${(cx-tw/2).toFixed(1)}" y="${(plotT-r).toFixed(1)}" width="${tw.toFixed(1)}"
        height="${(plotB-plotT+r*2).toFixed(1)}" rx="${(tw/2).toFixed(1)}" fill="var(--track)"/>
      <circle data-bar="${i}" class="${i===n-1?'on':''}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${p.color||opt.color||'var(--c-eco)'}"/>`;
  }).join('');
  const hits=points.map((p,i)=>`<rect class="hit" x="${(step*i).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${h}" rx="7" data-pt="${i}" aria-hidden="true"></rect>`).join('');
  const id=chartId({type:'dot', points, px, py, vbW:w, vbH:h});
  return frame(id, opt.title, points,
    `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true">${body}${axisLabels(labs,n)}${hits}</svg>`);
}

/* ---------- min–max capsules with a callout on the latest ---------- */
function spread(points, opt={}){
  if(!points.length) return noData(opt.empty);
  const w=opt.w||320, h=opt.h||120, labelH=opt.labels===false?4:20, pad=14;
  const color=opt.color||'var(--c-price)';
  const n=points.length, step=w/n, cw=Math.max(6, Math.min(11, step*0.34));
  const all=points.flatMap(p=>[+p.lo||0, +p.hi||0]);
  let lo=Math.min(...all), hi=Math.max(...all);
  const room=(hi-lo)||Math.max(hi*0.08,1); lo-=room*0.22; hi+=room*0.22;
  const span=(hi-lo)||1;
  const plotT=pad, plotB=h-labelH-pad;
  const Y=v=> plotB-(((v-lo)/span)*(plotB-plotT));
  const px=[], py=[], labs=[];
  const body=points.map((p,i)=>{
    const cx=step*i+step/2, y1=Y(+p.hi||0), y2=Y(+p.lo||0);
    const ht=Math.max(cw, y2-y1);
    px.push(cx); py.push(y1);
    if(labelH>4) labs.push({x:cx, y:h-3, t:p.label});
    return `<rect data-bar="${i}" class="${i===n-1?'on':''}" x="${(cx-cw/2).toFixed(1)}" y="${y1.toFixed(1)}"
      width="${cw.toFixed(1)}" height="${ht.toFixed(1)}" rx="${(cw/2).toFixed(1)}" fill="${color}"/>`;
  }).join('');
  const rails=`<line x1="0" y1="${plotT.toFixed(1)}" x2="${w}" y2="${plotT.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
    <line x1="0" y1="${plotB.toFixed(1)}" x2="${w}" y2="${plotB.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  const hits=points.map((p,i)=>`<rect class="hit" x="${(step*i).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${h}" rx="7" data-pt="${i}" aria-hidden="true"></rect>`).join('');
  const id=chartId({type:'spread', points, px, py, vbW:w, vbH:h});
  return frame(id, opt.title, points,
    `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true">${rails}${body}${axisLabels(labs,n)}${hits}</svg>`);
}

/* ---------- trend line ---------- */
function line(points, opt={}){
  if(!points.length) return noData(opt.empty);
  const w=opt.w||320, h=opt.h||120, labelH=opt.labels===false?4:20, padX=10, padT=14, padB=8;
  const color=opt.color||'var(--c-cost)';
  const pts=points.length===1?[points[0],points[0]]:points;
  const n=pts.length, vals=pts.map(p=>+p.value||0);
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const plotB=h-labelH-padB;
  const X=i=> padX + i*(w-2*padX)/(n-1);
  const Y=v=> plotB - ((v-min)/span)*(plotB-padT);
  const px=pts.map((p,i)=>X(i)), py=vals.map(Y);
  const path=px.map((x,i)=>(i?'L':'M')+x.toFixed(1)+' '+py[i].toFixed(1)).join(' ');
  const area=path+` L ${X(n-1).toFixed(1)} ${plotB} L ${X(0).toFixed(1)} ${plotB} Z`;
  const gid='g'+chartSeq;
  const knots=px.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${py[i].toFixed(1)}" r="2.4" fill="${color}"/>`).join('');
  const step=(w-2*padX)/(n-1);
  const labs=[]; if(labelH>4) pts.forEach((p,i)=> labs.push({x:X(i), y:h-3, t:p.label}));
  const hits=pts.map((p,i)=>{
    const x0=Math.max(0,X(i)-step/2), x1=Math.min(w,X(i)+step/2);
    return `<rect class="hit" x="${x0.toFixed(1)}" y="0" width="${(x1-x0).toFixed(1)}" height="${h}" rx="7" data-pt="${i}" aria-hidden="true"></rect>`;
  }).join('');
  const id=chartId({type:'line', points:pts, px, py, vbW:w, vbH:h});
  return frame(id, opt.title, pts, `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".30"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <line class="ch-guide" x1="0" y1="0" x2="0" y2="${plotB}"/>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${knots}
    <circle cx="${px[n-1].toFixed(1)}" cy="${py[n-1].toFixed(1)}" r="4.2" fill="${color}" stroke="var(--bg)" stroke-width="2.4"/>
    <circle class="ch-marker" cx="0" cy="0" r="5.6" fill="${color}" stroke="var(--bg)" stroke-width="2.4"/>
    ${axisLabels(labs,n)}${hits}</svg>`);
}

/* ---------- interaction ---------- */
function clearChart(wrap){
  wrap.classList.remove('sel');
  delete wrap.dataset.active;
  wrap.querySelector('.ch-tip')?.classList.remove('on','below');
  wrap.querySelector('.ch-marker')?.classList.remove('on');
  wrap.querySelector('.ch-guide')?.classList.remove('on');
  wrap.querySelectorAll('[data-bar]').forEach(b=> b.classList.remove('on'));
  const live=wrap.querySelector('.sr-only'); if(live) live.textContent='';
}
function clearCharts(except){
  $$('.chart-inter').forEach(w=>{ if(w!==except) clearChart(w); });
  if(!except) chartPinned=false;
}
function selectPoint(hit, pin){
  const wrap=hit.closest('.chart-inter'); if(!wrap) return;
  selectIndex(wrap, +hit.dataset.pt, pin);
}
function selectIndex(wrap, i, pin){
  const meta=CHARTS[wrap.dataset.chart]; if(!meta) return;
  const p=meta.points[i]; if(!p) return;
  clearCharts(wrap);

  const svg=wrap.querySelector('svg'), rect=svg.getBoundingClientRect();
  const x=meta.px[i]*(rect.width/meta.vbW), y=meta.py[i]*(rect.height/meta.vbH);

  if(meta.type==='line'){
    const mk=wrap.querySelector('.ch-marker');
    if(mk){ mk.setAttribute('cx', meta.px[i].toFixed(1)); mk.setAttribute('cy', meta.py[i].toFixed(1)); mk.classList.add('on'); }
    const gd=wrap.querySelector('.ch-guide');
    if(gd){ gd.setAttribute('x1', meta.px[i].toFixed(1)); gd.setAttribute('x2', meta.px[i].toFixed(1)); gd.classList.add('on'); }
  } else {
    wrap.querySelectorAll('[data-bar]').forEach(b=> b.classList.toggle('on', +b.dataset.bar===i));
  }
  wrap.classList.add('sel');
  wrap.dataset.active=i;

  const tip=wrap.querySelector('.ch-tip');
  tip.innerHTML=`<div class="t-l">${esc(p.label)}</div><div class="t-v">${esc(p.display)}</div>${p.sub?`<div class="t-s">${esc(p.sub)}</div>`:''}`;
  tip.classList.add('on');
  tip.classList.toggle('below', y<64);
  const half=tip.offsetWidth/2, wW=wrap.clientWidth;
  tip.style.left=Math.max(half+2, Math.min(wW-half-2, x)).toFixed(1)+'px';
  tip.style.top=y.toFixed(1)+'px';
  const live=wrap.querySelector('.sr-only');
  if(live) live.textContent=`${p.label}: ${p.display}${p.sub?', '+p.sub:''}`;
  if(pin){ chartPinned=true; pinnedAt=performance.now(); }
}
document.addEventListener('click', e=>{
  const hit=e.target.closest?.('[data-pt]');
  if(hit){
    const wrap=hit.closest('.chart-inter');
    // tap the live point again to dismiss — but not the click that opened it
    if(wrap && wrap.dataset.active===hit.dataset.pt && chartPinned && performance.now()-pinnedAt>350) clearCharts();
    else selectPoint(hit, true);
    return;
  }
  if(!e.target.closest?.('.chart-inter')) clearCharts();
}, true);
document.addEventListener('pointerover', e=>{
  if(e.pointerType && e.pointerType!=='mouse') return;
  const hit=e.target.closest?.('[data-pt]');
  if(hit && !chartPinned) selectPoint(hit, false);
});
document.addEventListener('pointerout', e=>{
  if((e.pointerType && e.pointerType!=='mouse') || chartPinned) return;
  const wrap=e.target.closest?.('.chart-inter');
  if(wrap && !wrap.contains(e.relatedTarget)) clearChart(wrap);
});
document.addEventListener('focusout', e=>{
  const wrap=e.target.closest?.('.chart-inter');
  if(wrap && !wrap.contains(e.relatedTarget)) clearChart(wrap);
});
/* Arrow / Home / End walk the series while the chart has focus. */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ clearCharts(); return; }
  const wrap=document.activeElement?.closest?.('.chart-inter'); if(!wrap) return;
  const meta=CHARTS[wrap.dataset.chart]; if(!meta) return;
  const last=meta.points.length-1;
  const cur=wrap.dataset.active===undefined?null:+wrap.dataset.active;
  let next=null;
  if(e.key==='ArrowRight') next=cur===null?0:Math.min(last,cur+1);
  else if(e.key==='ArrowLeft') next=cur===null?last:Math.max(0,cur-1);
  else if(e.key==='Home') next=0;
  else if(e.key==='End') next=last;
  else if((e.key==='Enter'||e.key===' ') && cur===null) next=last;
  else return;
  e.preventDefault();
  selectIndex(wrap, next, true);
});
window.addEventListener('resize', ()=> clearCharts());

/** Colour a mileage figure against the lifetime average. */
function ecoColor(mi, avg){
  if(!avg) return 'var(--c-eco)';
  if(mi >= avg*1.04) return 'var(--c-eco)';
  if(mi >= avg*0.94) return 'var(--c-warn)';
  return 'var(--c-svc)';
}
/** Bar labels adapt: day numbers inside a month, month names across a longer span. */
function seriesLabels(dates){
  if(!dates.length) return [];
  const span=(new Date(dates[dates.length-1])-new Date(dates[0]))/86400000;
  return span>50 ? dates.map(d=> MON[new Date(d).getMonth()])
                 : dates.map(d=> String(new Date(d).getDate()));
}

/* First-run setup is its own guided sheet rather than a trip to the vehicle

function bindSetupCard(scope){

function openVehicleSetup(){
  const t = vType(bike), sug = t.suggest;

    <div class="sub">Two numbers and RevvLog can work out your range, running costs and when a service is due. The rest can wait.</div>
    <div class="two">

      <div class="field"><label>Odometer now (km)</label><input id="vs-odo" class="num-in" type="number" inputmode="decimal" step="1" placeholder="0" value="${bike.odoBase??''}"/></div>
    </div>

      <input id="vs-res" class="num-in" type="number" inputmode="decimal" step="0.5" placeholder="${sug.reserve}" value="${bike.reserve??''}"/>
    </div>

      <div class="field"><label>Or every (months)</label><input id="vs-mon" class="num-in" type="number" inputmode="decimal" step="1" placeholder="${sug.serviceIntervalMonths}" value="${bike.serviceIntervalMonths??''}"/></div>

    if(!(tank>0)){ toast('Tank size, please','!'); $('#vs-tank').focus(); return; }
    if(odo===''){ toast('Odometer reading, please','!'); $('#vs-odo').focus(); return; }
    bike.tankSize = round(tank,1);
    bike.odoBase  = Math.max(0, round(+odo,0));
    /* stamping this now is what makes back-dated fills stop double-counting */
    bike.odoSetAt = new Date().toISOString();
    const res=$('#vs-res').value, iv=$('#vs-int').value, mo=$('#vs-mon').value;
    if(res!=='') bike.reserve = round(+res,1);

    save(); hideSheet(); renderAll();
    toast(`${vehicleLabel(bike)} is ready`,'✓');
  });

    label:labels[i], value:round(e.mileage,1), display:`${fmt(e.mileage,1)} km/l`,

    sub:`${fmtInt(m.dist)} km · ${fmt(m.litres,1)} L` }));
  const distPts = c.months.map(m=>({ label:m.label, value:m.dist, display:`${fmtInt(m.dist)} km`,
    sub:`${cur()}${fmtInt(m.spend)}${m.litres>0?` · ${fmt(m.dist/m.litres,1)} km/l`:''}` }));
  const tt = tripTotals(c);
  const thisMonth = c.months.length ? c.months[c.months.length-1] : null;

  const deltaDir = c.delta>0?'up':(c.delta<0?'down':'');
  body.innerHTML = `
    ${setupCard(c)}
    <div data-cat="all">
      <div class="hero${vehiclePhoto?' has-photo':''}">
        ${vehiclePhoto
          ? `<img class="photo" src="${vehiclePhoto}" alt="" aria-hidden="true">`
          : ''}
        <div class="h-label">Latest mileage</div>
        <div class="h-big"><span class="hn" data-count="${round(c.latest,1)}" data-dec="1">0.0</span><span class="h-unit">km/l</span></div>
        ${c.delta?`<div class="h-delta">${deltaDir==='up'?'▲':'▼'} ${fmt(Math.abs(c.delta),1)} km/l vs last tank</div>`:''}
        <div class="h-row">
          <div><div class="hv" data-count="${Math.round(c.fullRange)}">0</div><div class="hk">Full-tank range · km</div></div>
          <div><div class="hv" data-count="${round(c.effMi,1)}" data-dec="1">0.0</div><div class="hk">Effective km/l</div></div>
        </div>
      </div>
    </div>

    <div data-cat="all eco">
      <div class="card ring-card">
        <div class="ring-col">
          <div class="ring" role="img" aria-label="Tank ${Math.round(c.tankPct)} percent full">
            <div class="ruler-clip"><div class="ruler-fill" id="ruler-fill"></div></div>
            <div class="ruler-in">
              <span class="ruler-drop" id="ruler-drop" style="top:100%">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                  <path d="M12 1.5C18 9.5 21.5 13 21.5 16.5A9.5 9.5 0 0 1 2.5 16.5C2.5 13 6 9.5 12 1.5Z" fill="var(--bg)"/>
                  <circle cx="12" cy="16" r="3.4" fill="var(--brand)"/>
                </svg>
              </span>
            </div>
          </div>
          <div class="ruler-read">
            <span class="rr-n num" data-count="${Math.round(c.tankPct)}">0</span><span class="rr-p">%</span>
            <div class="rr-l">In tank</div>
          </div>
        </div>
        <div class="ring-meta">
          <div class="rr"><span class="rk">Range left</span><span class="rv ${c.remaining<=c.reserveRange?'warn':''}">${fmtInt(c.remaining)} km</span></div>
          <div class="rr"><span class="rk">${vType(bike).reserveLabel}</span><span class="rv">${fmtInt(c.reserveRange)} km</span></div>
          <div class="rr"><span class="rk">Since fill</span><span class="rv">${fmtInt(tripSinceFill)} km</span></div>
          <button class="btn" id="trip-set" style="margin-top:12px;padding:11px;font-size:13px">Update trip meter</button>
        </div>
      </div>
    </div>

    <div data-cat="all eco">
      ${metricCard({
        title:'Mileage', tag: c.delta ? `${c.delta>0?'▲':'▼'} ${fmt(Math.abs(c.delta),1)} vs last` : '',
        count: round(c.latest,1), dec:1, unit:'km/l',
        sub:`Lifetime ${fmt(c.lifetimeAvg,1)} km/l`,
        chart: dots(miPts,{title:'Mileage per tank', lo:miLo, hi:miHi, w:MINI_W, h:104, empty:'Log two fills'})

      <div class="tiles">
        ${tileN(round(c.best,1),'Best tank','km/l',1,'eco')}
        ${tileN(round(c.worst,1),'Worst tank','km/l',1)}
        ${tileN(round(c.recentAvg,1),'Rolling average','km/l',1)}
        ${tileN(Math.round(c.fullRange),'Full-tank range','km',0,'tank')}

    <div data-cat="all cost">
      ${metricCard({
        title:'Spending', tag: thisMonth?`${thisMonth.label} so far`:'',
        count: thisMonth?Math.round(thisMonth.spend):0, value:`${cur()}0`, unit:'',
        sub:`${cur()}${fmt(c.avgCpk,2)} per kilometre`,
        chart: bars(spendPts,{title:'Monthly spending', color:'var(--c-cost)', w:MINI_W, h:104, bw:13, empty:'No months yet'})
      }).replace('<span class="mc-n"','<span class="mc-n" data-prefix="'+cur()+'"')}

        ${tileN(round(c.totalLitres,1),'Fuel bought','L',1)}

      </div>
    </div>

    <div data-cat="all dist">
      ${metricCard({
        title:'Distance', tag:'odometer',
        count: Math.round(c.odo), unit:'km',
        sub:`${fmtInt(c.totalDist)} km logged from refuels`,
        chart: bars(distPts,{title:'Monthly distance', color:'var(--c-odo)', w:MINI_W, h:104, bw:13, empty:'No months yet'})
      })}
      ${serviceBanner(c,true)}
      <div class="card">
        <div class="mc-top"><span class="mc-t">Next service</span>
          <span class="mc-tag" style="${c.svcDue?'color:var(--c-svc)':''}">${c.svcDue?`${fmtInt(-c.kmToSvc)} km over`:`${fmtInt(c.kmToSvc)} km to go`}</span></div>
        <div class="pbar ${c.svcDue?'due':(c.svcSoon?'warn':'')}"><i style="width:${c.svcPct.toFixed(1)}%"></i></div>
        <div class="pscale"><span>${fmtInt(c.lastSvc)} km</span><span>every ${fmtInt(c.interval)} km</span><span>${fmtInt(c.nextSvc)} km</span></div>
      </div>
      <div class="tiles">
        ${tileN(tt.count,'Trips logged',null,0,'')}
        ${tileN(Math.round(tt.km),'Trip distance','km',0)}
      </div>
    </div>

    <div data-cat="all">
      ${secHead('Insights')}
      ${insightsHTML(c, tt)}
    </div>
  `;

  /* The drop and its reading start at the bottom of the rule and ride up to the
     level, so the gauge fills the way a tank does rather than just appearing.
     rAF gives the smooth start, but it never fires while the tab is hidden — so
     a timer backs it up, otherwise a gauge rendered in the background would sit
     reading empty until something re-rendered it. Setting it twice is harmless. */
  const seatDrop = ()=>{
    const pct = Math.max(0, Math.min(100, c.tankPct));
    const top = (100 - pct).toFixed(1) + '%';
    const d=$('#ruler-drop'), f=$('#ruler-fill');
    if(d) d.style.top = top;
    if(f) f.style.height = pct.toFixed(1) + '%';
  };
  requestAnimationFrame(seatDrop);
  setTimeout(seatDrop, 80);
  countUp(body);
  bindSetupCard(body);
  applyCat();
  $('#trip-set')?.addEventListener('click', openTripDialog);
}

function insightsHTML(c, tt){
  const rows=[];
  if(c.predictDays!=null){
    const d=Math.round(c.predictDays);
    rows.push(insight('calendar', `Next refill ${d<=0?'due now':`in about ${d} day${d===1?'':'s'}`}`,
      `You fill up roughly every ${Math.round(c.avgGap)} days`));
  }
  if(c.score){
    const label = c.score>=90?'Excellent':c.score>=75?'Strong':c.score>=55?'Steady':'Room to improve';
    rows.push(insight('spark', `Economy score <b>${c.score}</b>`, `${label} — recent tanks against your best`));
  }
  if(!c.svcDue && !c.svcSoon && c.odo>0){
    rows.push(insight('wrench', `<b>${fmtInt(c.kmToSvc)}</b> km to the next service`, `Odometer ${fmtInt(c.odo)} km · due at ${fmtInt(c.nextSvc)} km`));
  }
  if(tt && tt.count){
    rows.push(insight('route', `${tt.count} trip${tt.count===1?'':'s'} · <b>${fmtInt(tt.km)}</b> km`, `${cur()}${fmtInt(tt.spend)} spent on the road`));
  }
  const trend = c.latest && c.lifetimeAvg ? c.latest - c.lifetimeAvg : 0;
  if(Math.abs(trend)>=0.4){
    rows.push(insight(trend>0?'up':'down', `Running ${trend>0?'above':'below'} average`,
      `Latest tank ${trend>0?'+':''}${fmt(trend,1)} km/l against lifetime`));
  }
  return rows.join('') || insight('info','Keep logging','A few more fills unlock predictions and scoring');
}

function renderHistory(){
  const list = sortedEntries().reverse();

  const wrap = $('#history-list');
  const c = calc();
  let filtered = list;
  const now = new Date();
  if(historyFilter==='3') filtered = list.slice(0,3);
  else if(historyFilter==='month') filtered = list.filter(e=> monthKey(e.date)===monthKey(now));
  else if(historyFilter==='best'){ filtered=[...list].filter(e=>e.tripKm>0&&e.litres>0).sort((a,b)=> (b.tripKm/b.litres)-(a.tripKm/a.litres)); }
  if(searchQuery){ const q=searchQuery.toLowerCase(); filtered=filtered.filter(e=> (e.station||'').toLowerCase().includes(q) || (e.notes||'').toLowerCase().includes(q)); }

  if(!list.length){ wrap.innerHTML = emptyState('No refuels yet','Every fill-up you log sharpens your mileage, range and cost figures.','Log a refuel','fuel'); bindEmpty(wrap); return; }

        <div class="row-main">

          <div class="r2">${esc(e.station||'Unknown station')}${e.fuelType?' · '+esc(e.fuelType):''}</div>
        </div>
        <div class="row-end"><div class="e1">${cur()}${fmtInt(e.cost)}</div><div class="e2">${fmt(e.litres,2)} L</div></div>
      </div>
      <div class="row-body"><div class="row-inner">
        <div class="row-grid">
          <div class="g"><div class="gl">Trip</div><div class="gv">${fmtInt(e.tripKm)} km</div></div>
          <div class="g"><div class="gl">Price / L</div><div class="gv">${cur()}${fmt(ppl,2)}</div></div>
          <div class="g"><div class="gl">Cost / km</div><div class="gv">${cur()}${fmt(cpk,2)}</div></div>
          <div class="g"><div class="gl">Litres</div><div class="gv">${fmt(e.litres,2)} L</div></div>
        </div>
        ${e.notes?`<div class="row-note">“${esc(e.notes)}”</div>`:''}

/* ---------- Stats ---------- */
function renderAnalytics(){
  const c=calc(), body=$('#analytics-body');
  if(!c.count){ body.innerHTML = emptyState('Nothing to analyse','Log a few refuels and this fills up with trends, spending and economy charts.','Log a refuel','fuel'); bindEmpty(body); return; }

  const labels = seriesLabels(c.withMi.map(e=>e.date));
  const miPts = c.withMi.map((e,i)=>({ label:labels[i], value:round(e.mileage,1), display:`${fmt(e.mileage,1)} km/l`,
    sub:`${dayMon(e.date)} · ${fmtInt(e.tripKm)} km · ${fmt(e.litres,2)} L` }));

  // score each tank against the best one, coloured like Samsung's index charts
  const scorePts = c.withMi.map((e,i)=>{
    const s = c.best>0 ? Math.round((e.mileage/c.best)*100) : 0;
    return { label:labels[i], value:s, display:`${s} / 100`, color:ecoColor(e.mileage,c.lifetimeAvg),
             sub:`${fmt(e.mileage,1)} km/l on ${dayMon(e.date)}` };
  });

  // price spread per month — a capsule when you filled more than once, a dot when you didn't
  const pMap={};
  c.list.forEach(e=>{ const p=+e.pricePerLitre||(e.litres>0?e.cost/e.litres:0); if(p<=0) return;
    const k=monthKey(e.date); (pMap[k]=pMap[k]||{lo:p,hi:p,n:0,label:MON[new Date(e.date).getMonth()]});
    pMap[k].lo=Math.min(pMap[k].lo,p); pMap[k].hi=Math.max(pMap[k].hi,p); pMap[k].n++; });
  const pricePts = Object.keys(pMap).sort().slice(-7).map(k=>{ const m=pMap[k];
    return { label:m.label, lo:m.lo, hi:m.hi, value:m.hi,
             display: m.lo===m.hi ? `${cur()}${fmt(m.hi,2)}/L` : `${cur()}${fmt(m.lo,2)} – ${fmt(m.hi,2)}/L`,
             sub: `${m.n} fill${m.n===1?'':'s'} this month` }; });

  const cpkPts = c.withMi.map((e,i)=>({ label:labels[i], value:round(e.cpk,2), display:`${cur()}${fmt(e.cpk,2)}/km`,
    sub:`${cur()}${fmtInt(e.cost)} over ${fmtInt(e.tripKm)} km` }));
  const spendPts = c.months.map(m=>({ label:m.label, value:m.spend, display:`${cur()}${fmtInt(m.spend)}`, sub:`${fmtInt(m.dist)} km · ${fmt(m.litres,1)} L` }));
  const distPts  = c.months.map(m=>({ label:m.label, value:m.dist, display:`${fmtInt(m.dist)} km`, sub:`${cur()}${fmtInt(m.spend)} spent` }));

  body.innerHTML = `
    <div class="tiles">
      ${tileN(round(c.recentAvg,1),'Rolling average','km/l',1,'eco')}
      ${tileN(c.score,'Economy score',null,0)}
    </div>
    <div class="tiles">
      ${tileN(round(c.best,1),'Best tank','km/l',1,'eco')}
      ${tileN(round(c.worst,1),'Worst tank','km/l',1)}
    </div>
    ${chartCard('Mileage per tank', `${fmt(c.lifetimeAvg,1)} km/l lifetime`,
      line(miPts,{title:'Mileage per tank', color:'var(--c-eco)', h:132}), 'Tap any point for the full fill-up')}
    ${chartCard('Tank rating', 'against your best tank',
      dots(scorePts,{title:'Tank rating', lo:0, hi:100, h:126}))}
    ${chartCard('Fuel price', `${cur()}${fmt(latestPricePerLitre(),2)} latest`,
      spread(pricePts,{title:'Fuel price spread', color:'var(--c-price)', h:126, empty:'No prices recorded'}))}
    ${chartCard('Cost per kilometre', `${cur()}${fmt(c.avgCpk,2)} average`,
      line(cpkPts,{title:'Cost per kilometre', color:'var(--c-cost)', h:126}))}
    ${chartCard('Monthly spending', `${cur()}${fmtInt(spendPts.reduce((s,m)=>s+m.value,0))} total`,
      bars(spendPts,{title:'Monthly spending', color:'var(--c-cost)', h:126, bw:18, empty:'No months yet'}))}
    ${chartCard('Monthly distance', `${fmtInt(distPts.reduce((s,m)=>s+m.value,0))} km`,
      bars(distPts,{title:'Monthly distance', color:'var(--c-odo)', h:126, bw:18, empty:'No months yet'}))}`;
  countUp(body);
  pruneCharts();
}

          </div>

          ${tc.mileage?`<span class="pill ${tc.litresActual?'acc':''}"><b>${fmt(tc.mileage,1)}</b> km/l${tc.litresActual?'':' est'}</span>`:''}

/** "in 24 days" / "3 days ago" for a renewal date, or nothing if unset. */
function dueNote(d){
  if(!d) return '';
  const days = Math.ceil((new Date(String(d).slice(0,10)+'T12:00:00') - Date.now())/86400000);
  if(days < 0)  return `${fmtInt(-days)} day${days===-1?'':'s'} overdue`;
  if(days === 0) return 'Due today';
  return `In ${fmtInt(days)} day${days===1?'':'s'}`;
}

/** A spec that may simply not be filled in yet — never render null as a number. */
function num(v, unit){
  if(v==null || v==='') return unit ? 'Not set' : '—';
  const s = (+v % 1) ? fmt(+v,1) : fmtInt(+v);
  return unit ? `${s} ${unit}` : s;
}

/* The service card and banner lead with whichever clock has less headroom, so
   a vehicle that has sat all year reads "3 months over" rather than a
   reassuring "8,000 km to go". */
function svcHeadline(c){
  const overdueByTime = c.daysToSvc!=null && c.daysToSvc<=0;
  if(c.svcDue){
    if(overdueByTime && (c.kmToSvc>0 || c.dayPct>c.kmPct)){
      const d = Math.abs(c.daysToSvc);
      return `${fmtInt(d)} day${d===1?'':'s'} over`;
    }
    return `${fmtInt(-c.kmToSvc)} km over`;
  }
  if(c.svcBy==='time' && c.daysToSvc!=null) return `${fmtInt(c.daysToSvc)} day${c.daysToSvc===1?'':'s'} to go`;
  return `${fmtInt(c.kmToSvc)} km to go`;
}
function svcDetail(c){
  const kmPart = c.kmToSvc<=0 ? `Overdue since ${fmtInt(c.nextSvc)} km` : `Due at ${fmtInt(c.nextSvc)} km`;
  if(c.daysToSvc==null){
    return `${kmPart}${c.svcDays!=null?` · roughly ${c.svcDays} day${c.svcDays===1?'':'s'} away at your pace`:''}. Set a time interval too and whichever comes first will win.`;
  }
  const dPart = c.daysToSvc<=0 ? `overdue since ${dayMonYr(c.nextSvcDate)}` : `or ${dayMonYr(c.nextSvcDate)}`;
  return `${kmPart}, ${dPart} — whichever comes first.`;
}

/** Service reminder — shown on Home (tappable) and on the vehicle screen. */
function serviceBanner(c, link=false){
  const a = link ? ' data-go="bike"' : '';
  const byTime = c.daysToSvc!=null && c.dayPct>c.kmPct;
  if(c.svcDue){
    const why = (c.daysToSvc!=null && c.daysToSvc<=0 && (c.kmToSvc>0 || byTime))
      ? `It is ${fmtInt(Math.abs(c.daysToSvc))} day${Math.abs(c.daysToSvc)===1?'':'s'} past the ${dayMonYr(c.nextSvcDate)} service date.`
      : `You are ${fmtInt(-c.kmToSvc)} km past the ${fmtInt(c.nextSvc)} km mark.`;
    return `<div class="banner"${a}><div class="bi">${ico('wrench')}</div><div><div class="bt">Service overdue</div>
      <div class="bs">${why} Time to book it in.</div></div></div>`;
  }
  if(c.svcSoon){
    const head = (byTime && c.daysToSvc!=null)
      ? `Service due in ${fmtInt(c.daysToSvc)} day${c.daysToSvc===1?'':'s'}`
      : `Service due in ${fmtInt(c.kmToSvc)} km`;
    const sub = c.daysToSvc!=null
      ? `Next service at ${fmtInt(c.nextSvc)} km or ${dayMonYr(c.nextSvcDate)}, whichever comes first.`
      : `Next service at ${fmtInt(c.nextSvc)} km${c.svcDays!=null?` — roughly ${c.svcDays} day${c.svcDays===1?'':'s'} at your pace`:''}.`;
    return `<div class="banner soon"${a}><div class="bi">${ico('wrench')}</div><div><div class="bt">${head}</div>
      <div class="bs">${sub}</div></div></div>`;
  }
  return '';
}

/* ---------- Vehicle photo ----------
   A phone photo is several megabytes and localStorage gives us about five in
   total for everything, so the picture is downscaled and re-encoded before it
   is stored. Quota is still checked explicitly: a silent failure here would
   look like the app simply ignoring you. */
const PHOTO_MAX_W = 1280, PHOTO_QUALITY = 0.82;

/** Take a chosen file all the way to a stored photo. Split out from the picker
    so the processing can be exercised without a file dialog. */
function applyVehiclePhoto(file){
  return new Promise(resolve=>{
    if(!file) return resolve(false);
    const r=new FileReader();
    r.onerror=()=>{ toast('Could not read that image','!'); resolve(false); };
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>{ toast('That file is not an image RevvLog can read','!'); resolve(false); };
      img.onload=()=>{
        const scale = Math.min(1, PHOTO_MAX_W/img.naturalWidth);
        const w = Math.max(1, Math.round(img.naturalWidth*scale));
        const h = Math.max(1, Math.round(img.naturalHeight*scale));
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        let url;
        try { url = cv.toDataURL('image/jpeg', PHOTO_QUALITY); }
        catch(e){ toast('Could not process that image','!'); return resolve(false); }
        /* Written through localStorage directly rather than DB.set, because
           DB.set swallows a quota failure and falls back to memory — which
           would look like it worked until the next launch. */
        try { localStorage.setItem(K.vPhoto(activeId), JSON.stringify(url)); }
        catch(e){ toast('Not enough room on this device for that photo','!'); return resolve(false); }
        vehiclePhoto = url;
        renderAll(); toast('Photo set','✓');
        resolve(true);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
function pickVehiclePhoto(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.addEventListener('change',()=> applyVehiclePhoto(inp.files[0]));
  inp.click();
}

function bindEmpty(scope, fn){

/* ---------- Count-up animation ---------- */
function countUp(scope){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  scope.querySelectorAll('[data-count]').forEach(el=>{
    const to=parseFloat(el.dataset.count)||0, dec=parseInt(el.dataset.dec||'0'), dur=900;
    const pre=el.dataset.prefix||'';
    const unit = el.querySelector('.u');   // keep any trailing unit — writing textContent would drop it
    const put = v => {
      el.textContent = pre + v.toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec});
      if(unit) el.appendChild(unit);
    };
    if(reduce){ put(to); return; }
    let start=null;
    const tick=ts=>{ if(!start)start=ts; const p=Math.min(1,(ts-start)/dur); const e=1-Math.pow(1-p,3);
      put(to*e);
      if(p<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}

function openSheet(editId=null){
  const e = editId ? entries.find(x=>x.id===editId) : null;
  const today = todayLocal();
  const s=$('#sheet');
  s.innerHTML = `
    <div class="grab"></div>
    <h2>${e?'Edit refuel':'Add refuel'}</h2>
    <div class="sub">${e?'Update this fill-up':'Log a fill-up to keep your stats current'}</div>
    <div class="field"><label>Date</label><input id="f-date" type="date" value="${e?e.date.slice(0,10):today}"/></div>
    <div class="field"><label>Fuel type</label><select id="f-type">
      ${['Petrol','Premium (97)','Power/XP'].map(t=>`<option ${e&&e.fuelType===t?'selected':''}>${t}</option>`).join('')}
    </select></div>
    <div class="two">
      <div class="field"><label>Litres</label><input id="f-litres" class="num-in" type="number" inputmode="decimal" step="0.01" placeholder="0.00" value="${e?e.litres:''}"/></div>
      <div class="field"><label>Total cost (${cur()})</label><input id="f-cost" class="num-in" type="number" inputmode="decimal" step="0.01" placeholder="0" value="${e?e.cost:''}"/></div>
    </div>
    <div class="hint" id="f-ppl"></div>
    <div class="two">
      <div class="field"><label>Trip since last fill (km)</label><input id="f-trip" class="num-in" type="number" inputmode="decimal" step="1" placeholder="0" value="${e?e.tripKm:''}"/></div>
      <div class="field"><label>Price/litre (${cur()})</label><input id="f-ppl-in" class="num-in" type="number" inputmode="decimal" step="0.01" placeholder="auto" value="${e&&e.pricePerLitre?e.pricePerLitre:''}"/></div>
    </div>
    <!-- The app can infer this from the dates, but inference is a guess about
         what you meant. The switch shows the guess and lets you overrule it. -->
    <div class="optrow">
      <div class="or-t">
        <div class="or-l">Add this distance to the odometer</div>
        <div class="or-s" id="f-odo"></div>
      </div>
      <button class="switch" id="f-odo-sw" role="switch" aria-checked="true" type="button"
        aria-label="Add this distance to the odometer"><i></i></button>
    </div>
    <div class="field"><label>Station <span style="color:var(--faint)">· optional</span></label><input id="f-station" type="text" placeholder="e.g. HP Whitefield" value="${e?esc(e.station||''):''}"/></div>
    <div class="field"><label>Notes <span style="color:var(--faint)">· optional</span></label><textarea id="f-notes" placeholder="City ride, highway run, AC on…">${e?esc(e.notes||''):''}</textarea></div>
    <button class="save" id="f-save">${e?'Save changes':'Add refuel'}</button>
  `;
  const litres=$('#f-litres'), cost=$('#f-cost'), pplIn=$('#f-ppl-in'), pplHint=$('#f-ppl');
  let pplTouched = !!(e&&e.pricePerLitre);
  const syncPpl=()=>{ const l=+litres.value, ct=+cost.value; if(l>0&&ct>0){ const p=ct/l; pplHint.textContent=`≈ ${cur()}${fmt(p,2)} per litre`; if(!pplTouched) pplIn.value=round(p,2);} else pplHint.textContent=''; };
  litres.addEventListener('input',syncPpl); cost.addEventListener('input',syncPpl);
  pplIn.addEventListener('input',()=>{ pplTouched=true; });
  syncPpl();

  /* The switch starts on the app's own reading of the dates, and says why. Touch
     it and your answer sticks — `odoTouched` stops a later date change quietly
     overruling a decision you already made. */
  const odoNote=$('#f-odo'), odoSw=$('#f-odo-sw'), dateIn=$('#f-date'), tripIn=$('#f-trip');
  let odoTouched = !!(e && e.countsOdo!==undefined);
  const setSw = on => odoSw.setAttribute('aria-checked', on ? 'true' : 'false');
  const swOn  = () => odoSw.getAttribute('aria-checked')==='true';
  setSw(e ? countsToOdo(e) : true);

  const syncOdo=()=>{
    const c=calc();
    const predates = predatesOdoReading(dateIn.value);
    if(!odoTouched) setSw(!predates);
    const km=+tripIn.value||0;
    if(!swOn()){
      odoNote.textContent = predates && !odoTouched
        ? `Dated before your odometer reading, so it stays at ${fmtInt(c.odo)} km`
        : `Left off — the odometer stays at ${fmtInt(c.odo)} km`;
    } else {
      odoNote.textContent = km>0
        ? `Odometer → ${fmtInt(c.odo - tripSinceFill + km)} km`
        : 'These kilometres will move the odometer forward';
    }
  };
  odoSw.addEventListener('click',()=>{ odoTouched=true; setSw(!swOn()); syncOdo(); });
  ['change','input'].forEach(ev=> dateIn.addEventListener(ev,syncOdo));
  tripIn.addEventListener('input',syncOdo);
  syncOdo();

  $('#f-save').addEventListener('click',()=> saveEntry(editId));
  showSheet();
}
function saveEntry(editId){
  const litres=+$('#f-litres').value, cost=+$('#f-cost').value, trip=+$('#f-trip').value||0;
  if(!(litres>0)){ toast('Enter litres filled','!'); $('#f-litres').focus(); return; }
  if(!(cost>=0)){ toast('Enter the cost','!'); return; }
  const prev = editId ? entries.find(x=>x.id===editId) : null;
  const rec = {
    id: editId||uid(),
    createdAt: prev?.createdAt || new Date().toISOString(),
    date: $('#f-date').value || todayLocal(),
    fuelType: $('#f-type').value,
    litres: round(litres,2), cost: round(cost,2), tripKm: round(trip,0),
    pricePerLitre: +$('#f-ppl-in').value? round(+$('#f-ppl-in').value,2) : (litres>0?round(cost/litres,2):0),
    station: $('#f-station').value.trim(), notes: $('#f-notes').value.trim(),
    // the switch is the record's own answer, so the odometer never re-decides later
    countsOdo: $('#f-odo-sw').getAttribute('aria-checked')==='true'
  };
  const skipsOdo = !countsToOdo(rec);
  if(editId){ const i=entries.findIndex(x=>x.id===editId); entries[i]=rec; }
  else {
    entries.push(rec);
    // only the newest fill resets the "since fill" meter — back-filling an older
    // one shouldn't wipe the distance you've ridden since your actual last fill
    const isLatest = entries.every(x=> x.id===rec.id || new Date(x.date) <= new Date(rec.date));
    if(isLatest) tripSinceFill = 0;
  }
  save(); hideSheet(); renderAll();
  track('refuel_logged', { edit: !!editId, count: entries.length });
  toast(editId ? 'Refuel updated'
              : (skipsOdo ? 'Past refuel logged · odometer unchanged'
                          : (trip>0 ? `Refuel logged · odometer ${fmtInt(calc().odo)} km` : 'Refuel logged')),'✓');
  maybeServiceNudge();
}

function openTripSheet(editId=null){
  const t = editId ? trips.find(x=>x.id===editId) : null;
  const today = todayLocal();
  const mins = +t?.durationMins||0;
  const s=$('#sheet');
  s.innerHTML = `
    <div class="grab"></div>
    <h2>${t?'Edit trip':'Log a trip'}</h2>
    <div class="sub">${t?'Update this journey':'Where did you ride? Fuel use and cost are worked out for you.'}</div>
    <div class="two">
      <div class="field"><label>From</label><input id="t-from" type="text" placeholder="e.g. Bengaluru" value="${t?esc(t.from||''):''}"/></div>
      <div class="field"><label>Destination</label><input id="t-to" type="text" placeholder="e.g. Coorg" value="${t?esc(t.to||''):''}"/></div>
    </div>
    <div class="two">
      <div class="field"><label>Start date</label><input id="t-date" type="date" value="${t?t.date.slice(0,10):today}"/></div>
      <div class="field"><label>End date <span style="color:var(--faint)">· optional</span></label><input id="t-end" type="date" value="${t&&t.endDate?t.endDate.slice(0,10):''}"/></div>
    </div>
    <div class="field"><label>Distance covered (km)</label><input id="t-dist" class="num-in" type="number" inputmode="decimal" step="1" placeholder="0" value="${t?t.distanceKm:''}"/></div>
    <div class="two">
      <div class="field"><label>Riding time · hours</label><input id="t-h" class="num-in" type="number" inputmode="numeric" step="1" min="0" placeholder="0" value="${mins?Math.floor(mins/60):''}"/></div>
      <div class="field"><label>Minutes</label><input id="t-m" class="num-in" type="number" inputmode="numeric" step="1" min="0" max="59" placeholder="0" value="${mins?mins%60:''}"/></div>
    </div>
    <div class="field"><label>Ride type</label><select id="t-type">
      ${RIDE_TYPES.map(r=>`<option ${t&&t.rideType===r?'selected':''}>${r}</option>`).join('')}
    </select></div>
    <div class="two">
      <div class="field"><label>Fuel used (L) <span style="color:var(--faint)">· optional</span></label><input id="t-litres" class="num-in" type="number" inputmode="decimal" step="0.01" placeholder="auto" value="${t&&t.litres?t.litres:''}"/></div>
      <div class="field"><label>Fuel cost (${cur()}) <span style="color:var(--faint)">· optional</span></label><input id="t-fuel" class="num-in" type="number" inputmode="decimal" step="1" placeholder="auto" value="${t&&t.fuelCost?t.fuelCost:''}"/></div>
    </div>
    <div class="hint" id="t-est"></div>
    <div class="field"><label>Other costs (${cur()}) <span style="color:var(--faint)">· tolls, food, stay</span></label><input id="t-other" class="num-in" type="number" inputmode="decimal" step="1" placeholder="0" value="${t&&t.otherCost?t.otherCost:''}"/></div>
    <div class="field"><label>Notes <span style="color:var(--faint)">· optional</span></label><textarea id="t-notes" placeholder="Ghat roads, rain, pillion…">${t?esc(t.notes||''):''}</textarea></div>
    <label class="check" for="t-odo">
      <input id="t-odo" type="checkbox" ${(!t||t.countOdo!==false)?'checked':''}/>
      <div><div class="ct">Count towards odometer</div><div class="cs">Adds this distance to your trip meter and total kilometres</div></div>
    </label>
    <button class="save" id="t-save">${t?'Save changes':'Add trip'}</button>
  `;
  const est=()=>{
    const km=+$('#t-dist').value||0, c=calc(), ppl=latestPricePerLitre();
    if(km>0 && c.effMi>0){
      const l=km/c.effMi;
      $('#t-est').textContent = `≈ ${fmt(l,2)} L at ${fmt(c.effMi,1)} km/l${ppl>0?` · ${cur()}${fmtInt(l*ppl)} of fuel`:''}`;
    } else $('#t-est').textContent='';
  };
  $('#t-dist').addEventListener('input', est); est();
  $('#t-save').addEventListener('click',()=> saveTrip(editId));
  showSheet();
}

function saveTrip(editId){
  const dist = +$('#t-dist').value||0;
  const from = $('#t-from').value.trim(), to = $('#t-to').value.trim();
  if(!from && !to){ toast('Add a start or destination','!'); $('#t-from').focus(); return; }
  if(!(dist>0)){ toast('Enter the distance covered','!'); $('#t-dist').focus(); return; }
  const date = $('#t-date').value || todayLocal();
  const end  = $('#t-end').value || '';
  if(end && new Date(end) < new Date(date)){ toast('End date is before the start','!'); return; }
  const mins = Math.max(0, (+$('#t-h').value||0)*60 + (+$('#t-m').value||0));
  const countOdo = $('#t-odo').checked;
  const prev = editId ? trips.find(x=>x.id===editId) : null;

  // a ride that happened before you last set the odometer is already on the dial
  const stale = predatesOdoReading(end || date);
  const rec = {
    id: editId||uid(), from, to, date, endDate:end,
    distanceKm: round(dist,0), durationMins: mins, rideType: $('#t-type').value,
    litres: +$('#t-litres').value? round(+$('#t-litres').value,2):0,
    fuelCost: +$('#t-fuel').value? round(+$('#t-fuel').value,2):0,
    otherCost: +$('#t-other').value? round(+$('#t-other').value,2):0,
    notes: $('#t-notes').value.trim(), countOdo,
    odoCounted: countOdo && !(!prev && stale)
  };
  // keep the trip meter in step: only the change in counted distance moves it
  const was = (prev && tripCountsOdo(prev)) ? (+prev.distanceKm||0) : 0;
  const now = rec.odoCounted ? rec.distanceKm : 0;
  bumpTripMeter(now - was);

  if(prev){ trips[trips.findIndex(x=>x.id===editId)] = rec; }
  else trips.push(rec);
  save(); hideSheet(); renderAll();
  track('trip_logged', { edit: !!editId, count: trips.length });
  toast(editId ? 'Trip updated'
              : (countOdo && stale ? 'Past trip logged · odometer unchanged'
                                   : `Trip logged${rec.odoCounted?` · +${fmtInt(rec.distanceKm)} km`:''}`),'✓');
  maybeServiceNudge();
}

      <div class="cell"><div class="dl">Fuel cost${tc.fuelActual?'':' · est'}</div><div class="dv">${cur()}${fmtInt(tc.fuelCost)}</div></div>

    </div>

    <div class="foot-note" style="color:var(--faint);font-size:11.5px;margin-bottom:4px">
      ${t.countOdo!==false?'Counted towards your odometer.':'Not counted towards your odometer.'}
      ${tc.litresActual?'':` Fuel estimated at ${fmt(tc.effMi,1)} km/l${tc.ppl>0?` and ${cur()}${fmt(tc.ppl,2)}/L`:''}.`}
    </div>

    </div>`;
  $('#td-edit').addEventListener('click',()=> openTripSheet(id));

  showSheet();
}

function confirmDeleteTrip(id){
  const t=trips.find(x=>x.id===id); if(!t) return;
  showModal('Delete this trip?', `${t.from||'—'} → ${t.to||'—'} · ${fmtInt(t.distanceKm)} km`, 'Delete', ()=>{
    if(tripCountsOdo(t)) bumpTripMeter(-(+t.distanceKm||0));
    trips = trips.filter(x=>x.id!==id);
    save(); hideSheet(); renderAll(); toast('Trip deleted','✓');
  });
}

/** Trips and manual edits move the "since fill" meter, which rolls into the odometer. */
function bumpTripMeter(deltaKm){ tripSinceFill = Math.max(0, round(tripSinceFill + deltaKm, 0)); }

function openOdoDialog(){
  const c=calc(); const s=$('#sheet');
  s.innerHTML=`<div class="grab"></div><h2>Set odometer</h2>
    <div class="sub">Enter the reading on your dash. Everything you log afterwards is added on top automatically.</div>
    <div class="field"><label>Current odometer (km)</label><input id="o-in" class="num-in" type="number" inputmode="decimal" step="1" value="${Math.round(c.odo)}"/></div>
    <div class="foot-note" style="color:var(--faint);font-size:11.5px">
      Now: <b class="num">${fmtInt(c.odo)} km</b> = baseline ${fmtInt(bike.odoBase||0)} + ${fmtInt(c.odoDist)} from refuels + ${fmtInt(tripSinceFill)} since fill.
      <br/>Anything you log later but date before today counts towards your mileage stats, not this reading.
    </div>
    <button class="save" id="o-save">Save reading</button>`;
  showSheet();
  $('#o-save').addEventListener('click',()=>{
    const reading = Math.max(0, +$('#o-in').value||0);
    // rebase so the reading matches today and future logs keep accumulating
    bike.odoBase = round(reading - calc().loggedKm, 0);
    // stamp the moment, so back-dated fills and trips logged from here on don't re-count
    bike.odoSetAt = new Date().toISOString();
    save(); hideSheet(); renderAll(); toast('Odometer set','✓'); maybeServiceNudge(true);
  });
}

/* One sheet covers both halves of the job: when the last service happened, and
   when the next one is due. Asking for the schedule here rather than burying it
   in a settings row is the difference between a reminder that works and one
   that quietly never fires because nobody set an interval. */
function logService(){
  const c=calc(), t=vType(bike);
  const today=todayLocal();
  const sug = t.suggest;
  const s=$('#sheet');
  s.innerHTML=`<div class="grab"></div><h2>Log a service</h2>
    <div class="sub">Resets both counters. The next reminder lands on whichever comes first — the distance or the date.</div>
    <div class="two">
      <div class="field"><label>Odometer at service</label><input id="s-odo" class="num-in" type="number" inputmode="decimal" step="1" value="${Math.round(c.odo)}"/></div>
      <div class="field"><label>Date of service</label><input id="s-date" type="date" value="${today}"/></div>
    </div>
    <div class="two">
      <div class="field"><label>Next due after</label><input id="s-int" class="num-in" type="number" inputmode="decimal" step="100" placeholder="${sug.serviceInterval}" value="${bike.serviceInterval??''}"/><div class="ss" style="margin-top:5px;color:var(--faint);font-size:11.5px">kilometres</div></div>
      <div class="field"><label>Or after</label><input id="s-mon" class="num-in" type="number" inputmode="decimal" step="1" placeholder="${sug.serviceIntervalMonths}" value="${bike.serviceIntervalMonths??''}"/><div class="ss" style="margin-top:5px;color:var(--faint);font-size:11.5px">months · blank for distance only</div></div>
    </div>
    <div class="field"><label>What was done <span style="color:var(--faint)">· optional</span></label><input id="s-notes" type="text" placeholder="Oil, filter, chain…"/></div>
    <button class="save" id="s-save">Mark as serviced</button>`;
  showSheet();
  $('#s-save').addEventListener('click',()=>{
    const odo = Math.max(0, +$('#s-odo').value||0);
    const iv  = $('#s-int').value, mo = $('#s-mon').value;
    bike.lastServiceOdo  = round(odo,0);
    bike.lastServiceDate = $('#s-date').value || today;
    bike.serviceInterval = iv==='' ? (bike.serviceInterval ?? sug.serviceInterval) : Math.max(500, round(+iv,0));
    bike.serviceIntervalMonths = mo==='' ? null : Math.max(1, round(+mo,0));
    bike.serviceLog = [...(bike.serviceLog||[]), { odo:bike.lastServiceOdo, date:bike.lastServiceDate, notes:$('#s-notes').value.trim() }];
    serviceNudged = false;
    save(); hideSheet(); renderAll();
    track('service_logged');
    const n=calc();
    toast(`Serviced at ${fmtInt(odo)} km · next at ${fmtInt(n.nextSvc)} km${n.nextSvcDate?` or ${dayMon(n.nextSvcDate)}`:''}`,'🔧');
  });
}

/** One nudge per session (or right after an odo edit) when a service is due. */
let serviceNudged = false;
function maybeServiceNudge(force=false){
  const c=calc();
  if(!c.svcDue && !c.svcSoon) return;
  if(serviceNudged && !force) return;
  serviceNudged = true;
  // name the clock that actually fired, not whichever one is easier to print
  const byTime = c.daysToSvc!=null && c.dayPct>c.kmPct;
  const msg = c.svcDue
    ? (byTime && c.daysToSvc<=0
        ? `Service overdue by ${fmtInt(Math.abs(c.daysToSvc))} day${Math.abs(c.daysToSvc)===1?'':'s'}`
        : `Service overdue by ${fmtInt(-c.kmToSvc)} km`)
    : (byTime
        ? `Service due in ${fmtInt(c.daysToSvc)} day${c.daysToSvc===1?'':'s'}`
        : `Service due in ${fmtInt(c.kmToSvc)} km`);
  toast(msg, '🔧');
}

/* ---------- Bike / currency editors (lightweight prompt-in-sheet) ---------- */
function editBikeField(field){
  const t = vType(bike);
  const tyre = t.tyres.find(x=>x.k===field);
  const labels={
    name:`${t.label} name`, tankSize:'Tank size (L)', reserve:`${t.reserveLabel} (L)`,
    avgMileageOverride:'Override mileage (km/l) — blank for auto',
    serviceInterval:'Service every (km)', serviceIntervalMonths:'Service every (months)',
    lastServiceOdo:'Last service at (km)'
  };
  const subs={
    serviceInterval:`A reminder every time this many kilometres pass since the last service.`,
    serviceIntervalMonths:'A reminder this many months after the last service. Leave blank to go by distance only.',
    lastServiceOdo:'The odometer reading at your most recent service.',
    reserve:t.reserveHint
  };
  Object.assign(labels, {
    reg:'Registration number', year:'Model year', engineCC:'Engine (cc)',
    fuelType:'Fuel type', insuranceDue:'Insurance renewal', pucDue:'Emission / PUC due'
  });
  Object.assign(subs, {
    reg:'As it reads on the plate.',
    insuranceDue:'RevvLog will show how long you have left. It does not remind you — nothing here can send a notification.',
    pucDue:'Same as above: shown on this screen, not pushed to you.'
  });
  const label = labels[field] || (tyre ? `${tyre.label} tyre (psi)` : field);
  const sub   = subs[field] || (tyre ? 'Cold pressure, in psi.' : `Update your ${t.noun}’s configuration.`);
  const TEXT = ['name','reg'], DATE = ['insuranceDue','pucDue'];
  const isText = TEXT.includes(field), isDate = DATE.includes(field), isFuel = field==='fuelType';
  const FUELS = ['Petrol','Diesel','CNG','Electric'];
  const type = isDate ? 'date' : (isText ? 'text' : 'number');
  const s=$('#sheet');
  s.innerHTML=`<div class="grab"></div><h2>${esc(label)}</h2><div class="sub">${esc(sub)}</div>
    ${isFuel
      ? `<div class="field"><input id="bk-in" type="text" value="${esc(bike[field]??'')}" placeholder="Petrol"/></div>
         <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">${FUELS.map(x=>`<button class="chip" data-fuel="${x}" type="button">${x}</button>`).join('')}</div>`
      : `<div class="field"><input id="bk-in" class="${(isText||isDate)?'':'num-in'}" type="${type}" ${isDate||isText?'':'inputmode="decimal"'} value="${(isText||isDate)?esc(bike[field]??''):(bike[field]??'')}" placeholder="${field==='avgMileageOverride'||field==='serviceIntervalMonths'?'auto':''}"/></div>`}
    <button class="save" id="bk-save">Save</button>`;
  showSheet();
  if(isFuel) $$('#sheet [data-fuel]').forEach(b=> b.addEventListener('click',()=> $('#bk-in').value=b.dataset.fuel));
  $('#bk-save').addEventListener('click',()=>{
    const v=$('#bk-in').value;
    if(isText||isFuel) bike[field]=v.trim();
    else if(isDate) bike[field]= v || null;
    else if(field==='year')     bike[field]= v===''?null:Math.max(1900, round(+v,0));
    else if(field==='engineCC') bike[field]= v===''?null:Math.max(0, round(+v,0));
    /* blank means "unset", not zero — these three are legitimately optional and
       a 0 would read as a real answer the maths would then act on */
    else if(field==='avgMileageOverride')    bike[field]= v===''?null:round(+v,1);
    else if(field==='serviceIntervalMonths') bike[field]= v===''?null:Math.max(1, round(+v,0));
    else if(field==='serviceInterval')       bike[field]= v===''?null:Math.max(500, round(+v,0));
    else if(field==='lastServiceOdo')        bike[field]= Math.max(0, round(+v,0));
    else bike[field]= round(+v, field==='tankSize'||field==='reserve'?1:0);
    save(); hideSheet(); renderAll(); toast('Saved','✓');
    if(field==='serviceInterval'||field==='serviceIntervalMonths'||field==='lastServiceOdo'){
      serviceNudged=false; maybeServiceNudge();
    }
  });
}

/** Settings → Garage → a vehicle: switch to it, rename it, or remove it. */
function manageVehicle(id){
  const v = findVehicle(id); if(!v) return;
  const isActive = v.id === activeId;
  const s=$('#sheet');
  s.innerHTML=`<div class="grab"></div>
    <h2>${esc(vehicleLabel(v))}</h2>
    <div class="sub">${[esc(vehicleSub(v)), esc((v.colour&&v.colour.name)||''), esc(vType(v).label)].filter(Boolean).join(' · ')}</div>
    <div class="field"><label>Name</label>
      <input id="mv-name" type="text" maxlength="28" value="${esc(v.name||'')}" placeholder="${esc([v.brand,v.model].filter(Boolean).join(' '))}"/></div>
    ${isActive ? '' : `<button class="cta" id="mv-switch" style="width:100%;margin-bottom:10px">Switch to this vehicle</button>`}
    <button class="save" id="mv-save">Save name</button>
    <button class="lk-link" id="mv-del" type="button"
      style="display:block;width:100%;margin-top:16px;color:var(--c-svc);background:none;border:none;font:inherit;padding:12px;cursor:pointer">
      Remove from garage
    </button>`;
  showSheet();
  $('#mv-save').addEventListener('click',()=>{
    v.name = $('#mv-name').value.trim().slice(0,28);
    save(); hideSheet(); renderAll(); toast('Name updated','✓');
  });
  const sw = $('#mv-switch');
  if(sw) sw.addEventListener('click',()=>{ hideSheet(); switchVehicle(v.id); });
  $('#mv-del').addEventListener('click',()=>{
    /* The last vehicle cannot go: with an empty garage there is no app left to
       show, and silently dumping you back into setup from a Settings row would
       be a surprise. Reset everything is the deliberate way to do that. */
    if(vehicles.length === 1){
      hideSheet();
      showModal('This is your only vehicle', 'Removing it would leave RevvLog with nothing to show. Add another vehicle first, or use Reset everything in Settings.', 'Got it', ()=>{});
      return;
    }
    const n = DB.get(K.vEntries(v.id), []).length, t = DB.get(K.vTrips(v.id), []).length;
    hideSheet();
    showModal(`Remove ${vehicleLabel(v)}?`,
      `${n} refuel${n===1?'':'s'} and ${t} trip${t===1?'':'s'} logged against it will be deleted too. This cannot be undone.`,
      'Remove', ()=>{
        removeVehicle(v.id); renderAll(); toast('Removed from your garage','✓');
      });
  });
}

/* ---------- Export / Import / Reset ---------- */
/* The whole garage, not just the vehicle you happen to be looking at. The lock
   is deliberately left out: a backup is meant to travel to another device, and
   neither the PIN hash nor the fingerprint credential is any use on one. */
function exportData(){
  persistActive();
  const garage = vehicles.map(v=>({
    vehicle:v,
    entries:DB.get(K.vEntries(v.id), []),
    trips:DB.get(K.vTrips(v.id), []),
    tripSinceFill:DB.get(K.vTrip(v.id), 0),
    /* photos travel with the backup — they are the one thing you cannot
       reconstruct from memory, and they are already downscaled */
    photo:DB.get(K.vPhoto(v.id), null)
  }));
  const payload={ app:'revvlog', version:4, exportedAt:new Date().toISOString(),
                  settings, activeVehicle:activeId, garage };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=`revvlog-${todayLocal()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000); toast('Backup downloaded','⤓');
  track('data_export', { vehicles: vehicles.length });
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.addEventListener('change',()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d || !Array.isArray(d.garage)){ toast('That is not a RevvLog backup','!'); return; }
      /* Import replaces the garage rather than merging into it — merging two
         sets of vehicles silently produces duplicates you then have to unpick. */
      clearGarageStores();
      vehicles = [];
      d.garage.forEach(g=>{
        if(!g || !g.vehicle) return;
        const rec = newVehicle(g.vehicle);
        vehicles.push(rec);
        DB.set(K.vEntries(rec.id), Array.isArray(g.entries)?g.entries:[]);
        DB.set(K.vTrips(rec.id),   Array.isArray(g.trips)?g.trips:[]);
        DB.set(K.vTrip(rec.id),    Math.max(0, +g.tripSinceFill||0));
        if(typeof g.photo === 'string' && g.photo) DB.set(K.vPhoto(rec.id), g.photo);
      });
      if(d.settings) settings=Object.assign(settings, d.settings);
      DB.set(K.vehicles, vehicles);
      activeId=null; bike=null;
      loadVehicle(d.activeVehicle || (vehicles[0] && vehicles[0].id) || null);
      DB.set(K.onboarded, vehicles.length>0);
      renderAll();
      track('data_import', { vehicles: vehicles.length });
      toast(`Imported ${vehicles.length} vehicle${vehicles.length===1?'':'s'}`,'✓');
    }catch(err){ toast('Could not read that file','!'); } };
    r.readAsText(f);
  }); inp.click();
}
/** Drop every per-vehicle store. Used by both import and reset. */
function clearGarageStores(){
  vehicles.forEach(v=>[K.vEntries(v.id), K.vTrips(v.id), K.vTrip(v.id), K.vPhoto(v.id)].forEach(k=>DB.del(k)));
}
function resetAll(){
  showModal('Reset everything?', 'This permanently deletes every vehicle in your garage, all their refuels and trips, your settings and your app PIN on this device. This cannot be undone.', 'Delete all', ()=>{
    clearGarageStores();
    vehicles=[]; entries=[]; trips=[]; tripSinceFill=0; bike=null; activeId=null;
    DB.del(K.vehicles); DB.del(K.active); DB.del(K.onboarded);
    settings={ currency:'₹', riderName:'' }; serviceNudged=false;

    location.reload();

}
