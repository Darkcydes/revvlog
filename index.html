/* ==================================================================
   APP LOCK — the login screen
   ------------------------------------------------------------------
   A four-digit PIN guards the garage, with the phone's own fingerprint
   as an optional way past it.

   Honest about what this is: the refuels still sit unencrypted in
   localStorage, so this is a lock on the front door rather than a safe.
   The PIN is kept as a PBKDF2 hash so the digits are never written down,
   and the fingerprint path is WebAuthn against the platform
   authenticator — with no server to check a signature against, a
   ceremony that completes is the proof, which is as far as an app with
   no account behind it can go.
   ================================================================== */
const PIN_LEN      = 4;
const PIN_ITER     = 160000;
const LOCK_TRIES   = 5;          // wrong PINs before the keypad cools off
const LOCK_COOL    = 30000;      // first cool-off, doubling each time after
const LOCK_COOL_MAX= 300000;     // ...up to five minutes
const RELOCK_AFTER = 3*60*1000;  // re-lock if the app sat in the background this long

let lockCfg  = DB.get(K.lock, null);
let lockStep = 'enter';          // sensor | enter | create | confirm | bio
let lockCtx  = 'open';           // 'open' = getting in · 'change' = editing the PIN from Settings
let pinBuf = '', pinFirst = '';
let coolTimer = null, bioBusy = false, bioCap = null, hiddenSince = 0;

const hasPin = () => !!(lockCfg && lockCfg.hash);
const bioOn  = () => !!(lockCfg && lockCfg.bio && lockCfg.bio.id);
/** Whoever set up a fingerprint gets the sensor, not a keypad they didn't ask for. */
const entryStep = () => bioOn() ? 'sensor' : 'enter';
const coolLeft = () => Math.max(0, ((lockCfg && lockCfg.until) || 0) - Date.now());
const saveLock = () => DB.set(K.lock, lockCfg);

const b64   = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const rand  = n => crypto.getRandomValues(new Uint8Array(n));

/** Derives the stored form of a PIN. Returns null if the record's algorithm
    isn't available here — SubtleCrypto needs a secure context. */
async function derive(pin, saltB64, alg, iter){
  if(alg === 'pbkdf2'){
    if(!(window.crypto && crypto.subtle)) return null;
    const key  = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name:'PBKDF2', salt:unb64(saltB64), iterations:iter||PIN_ITER, hash:'SHA-256' }, key, 256);
    return b64(bits);
  }
  // plain-http origin, no SubtleCrypto — weaker, but still not the digits themselves
  let h = 0x811c9dc5; const src = pin + '|' + saltB64;
  for(let i=0;i<src.length;i++){ h ^= src.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return 'w' + h.toString(36);
}
const pinAlg = () => (window.crypto && crypto.subtle) ? 'pbkdf2' : 'weak';

async function savePin(pin){
  const salt = b64(rand(16)), alg = pinAlg();
  const hash = await derive(pin, salt, alg, PIN_ITER);
  lockCfg = Object.assign({ v:1, bio:null }, lockCfg || {},
    { alg, salt, iter:PIN_ITER, hash, fails:0, until:0, setAt:new Date().toISOString() });
  saveLock();
}
async function verifyPin(pin){
  if(!hasPin()) return false;
  const h = await derive(pin, lockCfg.salt, lockCfg.alg||'pbkdf2', lockCfg.iter);
  return !!h && h === lockCfg.hash;
}

/* ---------- Fingerprint (WebAuthn, platform authenticator only) ---------- */
async function bioCapable(){
  if(bioCap !== null) return bioCap;
  try{
    bioCap = !!(window.PublicKeyCredential && window.isSecureContext &&
      await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  }catch(e){ bioCap = false; }
  return bioCap;
}
async function bioEnroll(){
  const who = (settings.riderName||'').trim() || 'Rider';
  const cred = await navigator.credentials.create({ publicKey:{
    challenge: rand(32),
    rp:{ name:'RevvLog' },
    user:{ id: rand(16), name: who, displayName: who },
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
    attestation:'none', timeout:60000
  }});
  if(!cred) throw new Error('no credential');
  return b64(cred.rawId);
}
async function bioCheck(){
  if(!bioOn()) return false;
  const got = await navigator.credentials.get({ publicKey:{
    challenge: rand(32),
    allowCredentials:[{ type:'public-key', id: unb64(lockCfg.bio.id), transports:['internal'] }],
    userVerification:'required', timeout:60000
  }});
  return !!got;
}

/* ---------- The screen ---------- */
/* The R mark, vectorised from the artwork. currentColor on the R is what lets
   one shape serve white on the orange tile and near-black on a light surface;
   the dash keeps the brand orange either way. Mirrors logo-mark.svg. */
const LOCK_MARK = '<svg viewBox="0 0 334 296" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="53" stroke-linecap="round"><path d="M30.5 25.5 H236.5 A71.1 71.1 0 1 1 182 141.6"/><path d="M200 142.5 305 269.5"/></g><path class="logo-dash" d="M30.5 212 H141 L191 253.5 A20 20 0 0 1 171 273 H30.5 A30.5 30.5 0 0 1 30.5 212 Z" fill="#F26610"/></svg>';

const LOCK_COPY = {
  enter:  { t:'Welcome back',  s:'Enter your PIN to open the garage.' },
  create: { t:'Set your PIN',  s:'Four digits, and you’ll use them every time you open the app.' },
  confirm:{ t:'Confirm your PIN', s:'Type those four digits once more.' }
};

function renderLock(){
  const el = $('#lock-in');
  if(lockStep === 'bio'){ el.innerHTML = bioStepHTML(); return; }
  if(lockStep === 'sensor'){ el.innerHTML = sensorHTML(); refreshCool(); return; }
  const c = LOCK_COPY[lockStep];
  el.innerHTML = `
    <div class="lk-head">
      <div class="mark">${LOCK_MARK}</div>
      <h2>${c.t}</h2><p>${c.s}</p>
    </div>
    <div class="pin-dots" id="lk-dots" role="img" aria-label="${pinBuf.length} of ${PIN_LEN} digits entered">${'<i></i>'.repeat(PIN_LEN)}</div>
    <div class="lk-msg" id="lk-msg" role="status" aria-live="polite"></div>
    ${padHTML()}
    ${footHTML()}`;
  paintDots();
  refreshCool();
}

/** The fingerprint-first way in: no keypad at all until it's asked for. */
function sensorHTML(){
  return `<div class="lk-head">
      <button class="bio-hero tap pulse" data-act="bio" type="button" aria-label="Unlock with your fingerprint">${ico('finger')}</button>
      <h2>Welcome back</h2>
      <p>Touch the sensor to open the garage.</p>
    </div>
    <div class="lk-msg calm" id="lk-msg" role="status" aria-live="polite"></div>
    <div class="lk-acts"><button class="lk-link" data-act="pin" type="button">Enter your PIN instead</button></div>`;
}

function padHTML(){
  return `<div class="pad" id="lk-pad">
    ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-d="${n}" type="button">${n}</button>`).join('')}
    <span class="key blank" aria-hidden="true"></span>
    <button class="key" data-d="0" type="button">0</button>
    <button class="key ghost" data-act="del" type="button" aria-label="Delete last digit">${ico('back')}</button>
  </div>`;
}

function footHTML(){
  if(lockStep === 'create') return `<div class="lk-note"><div class="ni">${ico('lock')}</div>
      <div class="nt">The PIN never leaves this phone. It is stored as a hash, not as the digits you type.</div></div>
    ${lockCtx==='change' ? `<div class="lk-acts"><button class="lk-link" data-act="cancel" type="button">Cancel</button></div>` : ''}`;
  if(lockStep === 'confirm') return `<div class="lk-acts"><button class="lk-link" data-act="restart" type="button">Pick a different PIN</button></div>`;
  return `<div class="lk-acts">
    ${bioOn() ? `<button class="lk-link" data-act="sensor" type="button">Use your fingerprint instead</button>` : ''}
    <button class="lk-link" data-act="forgot" type="button">Forgot your PIN?</button></div>`;
}

function bioStepHTML(){
  return `<div class="lk-head">
      <div class="bio-hero pulse">${ico('finger')}</div>
      <h2>Unlock with your fingerprint?</h2>
      <p>Use the fingerprint this phone already knows instead of typing your PIN every time.</p>
    </div>
    <div class="lk-msg calm" id="lk-msg" role="status" aria-live="polite"></div>
    <div class="lk-note"><div class="ni">${ico('info')}</div>
      <div class="nt">Your fingerprint stays with the phone’s secure hardware — the app only ever hears whether it matched. Your PIN keeps working either way.</div></div>
    <div class="lk-acts">
      <button class="btn primary" data-act="enroll" type="button">Use my fingerprint</button>
      <button class="lk-link" data-act="skip" type="button">Not now — PIN only</button>
    </div>`;
}

function setMsg(text, calm){
  const m = $('#lk-msg'); if(!m) return;
  m.textContent = text || '';
  m.classList.toggle('calm', !!calm);
}
function paintDots(){
  const d = $('#lk-dots'); if(!d) return;
  d.classList.remove('bad');
  d.setAttribute('aria-label', `${pinBuf.length} of ${PIN_LEN} digits entered`);
  Array.from(d.children).forEach((n,i)=> n.classList.toggle('on', i < pinBuf.length));
}
function goStep(step, msg){
  lockStep = step; pinBuf = '';
  if(step === 'create') pinFirst = '';
  renderLock();
  if(msg) setMsg(msg, true);
}

function pushDigit(d){
  if(coolLeft() > 0 || bioBusy || pinBuf.length >= PIN_LEN) return;
  setMsg('');
  pinBuf += d;
  paintDots();
  if(pinBuf.length === PIN_LEN) setTimeout(submitPin, 140);
}
function delDigit(){
  if(coolLeft() > 0) return;
  pinBuf = pinBuf.slice(0,-1); paintDots(); setMsg('');
}
/** Shake, buzz, then clear — the keypad's way of saying no. */
function badPin(msg){
  const d = $('#lk-dots');
  if(d) d.classList.add('bad');
  try{ navigator.vibrate && navigator.vibrate(90); }catch(e){}
  setMsg(msg);
  setTimeout(()=>{ pinBuf=''; const n=$('#lk-dots'); if(n){ n.classList.remove('bad');
    Array.from(n.children).forEach(x=>x.classList.remove('on')); } }, 480);
}

async function submitPin(){
  const pin = pinBuf;
  if(lockStep === 'create'){
    pinFirst = pin; pinBuf = ''; lockStep = 'confirm'; renderLock(); return;
  }
  if(lockStep === 'confirm'){
    if(pin !== pinFirst){ badPin('Those two didn’t match'); setTimeout(()=> goStep('create','Pick your PIN again.'), 700); return; }
    await savePin(pin);
    if(lockCtx === 'change'){ closeLock(); renderSettings(); toast('PIN updated','✓'); return; }
    if(await bioCapable()){ goStep('bio'); return; }
    finishSetup(false);
    return;
  }
  // 'enter' — the only step that can be wrong in a way that matters
  if(await verifyPin(pin)){
    lockCfg.fails = 0; lockCfg.until = 0; saveLock();
    enterApp();
  } else {
    registerFail();
  }
}

function registerFail(){
  lockCfg.fails = (lockCfg.fails||0) + 1;
  const left = LOCK_TRIES - lockCfg.fails;
  if(left <= 0){
    const wait = Math.min(LOCK_COOL * Math.pow(2, lockCfg.fails - LOCK_TRIES), LOCK_COOL_MAX);
    lockCfg.until = Date.now() + wait;
  }
  saveLock();
  badPin(left > 0 ? `Wrong PIN — ${left} ${left===1?'try':'tries'} left` : '');
  if(coolLeft() > 0) setTimeout(refreshCool, 480);
}

/** Locks the keypad out while the cool-off runs, counting it down as it goes. */
function refreshCool(){
  clearInterval(coolTimer); coolTimer = null;
  const keys = () => Array.from(document.querySelectorAll('#lk-pad .key, .bio-hero[data-act]'));
  if(coolLeft() <= 0){ keys().forEach(k=> k.removeAttribute('disabled')); return; }
  const tick = ()=>{
    const ms = coolLeft();
    if(ms <= 0){
      clearInterval(coolTimer); coolTimer = null;
      keys().forEach(k=> k.removeAttribute('disabled'));
      setMsg('Try again.', true);
      return;
    }
    keys().forEach(k=> k.setAttribute('disabled',''));
    const s = Math.ceil(ms/1000);
    setMsg(s >= 60 ? `Too many attempts. Try again in ${Math.ceil(s/60)} min.` : `Too many attempts. Try again in ${s}s.`);
  };
  tick(); coolTimer = setInterval(tick, 1000);
}

async function tryBio(auto){
  if(bioBusy || coolLeft() > 0) return;
  bioBusy = true;
  setMsg('Touch the sensor…', true);
  try{
    if(await bioCheck()){
      lockCfg.fails = 0; lockCfg.until = 0; saveLock();
      enterApp(); return;
    }
    setMsg(auto ? '' : 'Fingerprint not recognised — try again, or use your PIN');
  }catch(err){
    // a cancelled prompt is a choice, not an error — leave the screen as it was
    setMsg((auto || (err && err.name === 'NotAllowedError')) ? '' : 'Fingerprint unavailable — use your PIN');
  }finally{ bioBusy = false; }
}

/** The last step of first-run setup. */
function finishSetup(withBio){
  toast(withBio ? 'PIN and fingerprint set' : 'PIN set', '✓');
  enterApp();
}
async function enrollFromSetup(){
  if(bioBusy) return;
  bioBusy = true;
  setMsg('Touch the sensor…', true);
  try{
    const id = await bioEnroll();
    lockCfg.bio = { id, addedAt:new Date().toISOString() }; saveLock();
    finishSetup(true);
  }catch(err){
    setMsg(err && err.name === 'NotAllowedError' ? 'No fingerprint registered — you can turn it on later in Settings.'
                                                 : 'Couldn’t register that fingerprint — your PIN still works.', true);
  }finally{ bioBusy = false; }
}

function enterApp(){
  pinBuf = ''; pinFirst = ''; lockCtx = 'open';
  clearInterval(coolTimer); coolTimer = null;
  $('#lock').hidden = true;
  /* The PIN is only step one. A first run hands straight over to setup rather
     than dropping you on an empty dashboard with nothing to look at. */
  if(!DB.get(K.onboarded,false) || !vehicles.length){ startOnboarding(); return; }
  document.body.classList.remove('locked');
  renderAll();                 // re-run now it's visible, so the numbers count up on arrival
  showView(currentView);
  maybeServiceNudge();
}
function lockApp(){
  if(!hasPin() || !$('#lock').hidden) return;
  hideSheet(); $('#modal').classList.remove('show');
  lockCtx = 'open'; lockStep = entryStep(); pinBuf = ''; pinFirst = '';
  document.body.classList.add('locked');
  $('#lock').hidden = false;
  renderLock();
  if(lockStep === 'sensor') setTimeout(()=> tryBio(true), 260);
}
function closeLock(){
  $('#lock').hidden = true;
  document.body.classList.remove('locked');
  lockCtx = 'open'; pinBuf = ''; pinFirst = '';
  clearInterval(coolTimer); coolTimer = null;
}

/* ---------- Entry points from Settings ---------- */
function changePin(){
  lockCtx = 'change'; lockStep = 'create'; pinBuf = ''; pinFirst = '';
  document.body.classList.add('locked');
  $('#lock').hidden = false;
  renderLock();
  setMsg('Choose a new four-digit PIN.', true);
}
async function toggleBio(){
  if(bioOn()){
    showModal('Turn off fingerprint unlock?', 'You’ll open the app with your PIN from now on.', 'Turn off', ()=>{
      lockCfg.bio = null; saveLock(); renderSettings(); toast('Fingerprint unlock off','✓');
    });
    return;
  }
  if(!(await bioCapable())){ toast('No fingerprint set up on this device','!'); return; }
  try{
    const id = await bioEnroll();
    lockCfg.bio = { id, addedAt:new Date().toISOString() }; saveLock();
    renderSettings(); toast('Fingerprint unlock on','✓');
  }catch(err){
    if(!(err && err.name === 'NotAllowedError')) toast('Could not register that fingerprint','!');
  }
}
/** No account, no recovery — the only way back in is an empty garage. */
function forgotPin(){
  showModal('Forgotten your PIN?',
    'There is nothing to email you — everything lives on this phone. You can erase the app and start fresh, which deletes every refuel, trip and setting along with the PIN.',
    'Erase and start over', ()=>{
      [K.entries, K.trips, K.bike, K.settings, K.trip, K.lock].forEach(k=> DB.del(k));
      location.reload();
    });
}

/* ---------- Wiring ---------- */
$('#lock-in').addEventListener('click', e=>{
  const k = e.target.closest('[data-d],[data-act]'); if(!k) return;
  if(k.dataset.d !== undefined) return pushDigit(k.dataset.d);
  ({ del:delDigit, bio:()=>tryBio(false), forgot:forgotPin, cancel:closeLock,
     pin:()=>goStep('enter'), sensor:()=>{ goStep('sensor'); tryBio(false); },
     restart:()=>goStep('create','Pick your PIN.'), enroll:enrollFromSetup,
     skip:()=>finishSetup(false) })[k.dataset.act]?.();
});
document.addEventListener('keydown', e=>{
  if($('#lock').hidden || lockStep === 'bio') return;
  if($('#modal').classList.contains('show')) return;
  const digit = /^[0-9]$/.test(e.key);
  // typing on the fingerprint screen is a request for the keypad
  if(lockStep === 'sensor'){ if(digit){ e.preventDefault(); goStep('enter'); pushDigit(e.key); } return; }
  if(digit){ e.preventDefault(); pushDigit(e.key); }
  else if(e.key === 'Backspace'){ e.preventDefault(); delDigit(); }
});
/* Coming back to a long-backgrounded app should feel like opening it fresh. */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ hiddenSince = Date.now(); return; }
  if(hiddenSince && Date.now() - hiddenSince > RELOCK_AFTER) lockApp();
  hiddenSince = 0;
});

/* ---------- Service worker (offline PWA when served over http/https) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ---------- Seed demo data on very first run (optional, empty by default) ---------- */
// Kept empty: app starts clean. Users log their own data.

/* ---------- Boot ----------
   Loading screen first, then the lock. The app is rendered behind both, so
   whichever way you get in the garage is already standing there. */
/* ==================================================================
   VEHICLE CHROME — the switcher in the top bar and the pill's label
   ================================================================== */
/* the pill's vehicle tab wears the shape of whatever you are looking at */
const VEH_ICON = {
  motorcycle:'<circle cx="5.5" cy="17" r="3.2"/><circle cx="18.5" cy="17" r="3.2"/><path d="M5.5 17l4-8h5l3 5.5M9 9h6M14.5 9l2.5 5"/>',
  car:'<path d="M3 13.5 4.8 8.4A2.4 2.4 0 0 1 7.06 6.8h9.88a2.4 2.4 0 0 1 2.26 1.6L21 13.5"/><path d="M3 13.5h18v3.9H3z"/><circle cx="7" cy="17.4" r="1.6"/><circle cx="17" cy="17.4" r="1.6"/>'
};
/** A vehicle at a glance in a list: its photo where it has one, otherwise its
    type glyph in its own colour. The active vehicle's photo is already in
    memory; any other has to be fetched. */
function vehicleThumb(v){
  const p = (v && v.id===activeId) ? vehiclePhoto : (v ? DB.get(K.vPhoto(v.id), null) : null);
  if(p) return `<span class="vthumb"><img src="${p}" alt="" aria-hidden="true"></span>`;
  const hex = (v&&v.colour&&v.colour.hex)||'#63666A';
  return `<span class="vthumb glyph" style="color:${esc(hex)}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${VEH_ICON[(v&&v.type)]||VEH_ICON.motorcycle}</svg></span>`;
}
const vehicleSub = v => [v&&v.brand, v&&v.model].filter(Boolean).join(' ') || vType(v).label;

function renderVehicleChrome(){
  const pick = $('#veh-pick'), name = $('#vp-name'), dot = $('#vp-dot');
  if(name) name.textContent = bike ? vehicleLabel(bike) : 'Add vehicle';
  if(dot)  dot.style.background = (bike && bike.colour && bike.colour.hex) || 'var(--dim)';
  if(pick) pick.setAttribute('aria-label', bike ? `Switch vehicle — currently ${vehicleLabel(bike)}` : 'Add a vehicle');
  const lbl = $('#nav-veh-label');
  if(lbl) lbl.textContent = vType(bike).navLabel;
  const svg = $('#nav-veh svg');
  if(svg) svg.innerHTML = VEH_ICON[(bike&&bike.type)] || VEH_ICON.motorcycle;
}

function vehMenuHTML(){
  const rows = vehicles.map(v=>`
    <button class="vm-item" role="option" aria-selected="${v.id===activeId}" data-veh="${esc(v.id)}" type="button">
      <span class="vm-k" style="background:${esc((v.colour&&v.colour.hex)||'#63666A')}"></span>
      <span class="vm-t"><span class="vm-n">${esc(vehicleLabel(v))}</span><span class="vm-s">${esc(vehicleSub(v))}</span></span>
    </button>`).join('');
  return `${rows}${vehicles.length?'<div class="vm-sep"></div>':''}
    <button class="vm-item vm-add" data-veh-add="1" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add a vehicle
    </button>`;
}
function openVehMenu(){
  const menu = $('#veh-menu'), btn = $('#veh-pick');
  if(!menu || !btn) return;
  menu.innerHTML = vehMenuHTML();
  menu.hidden = false;
  btn.setAttribute('aria-expanded','true');
  const r = btn.getBoundingClientRect();
  menu.style.top  = `${r.bottom + 8}px`;
  /* right-align to the button, then pull back inside the viewport if the name
     is long enough to push the menu off the edge */
  const w = menu.offsetWidth;
  menu.style.left = `${Math.max(14, Math.min(r.right - w, window.innerWidth - w - 14))}px`;
}
function closeVehMenu(){
  const menu = $('#veh-menu'), btn = $('#veh-pick');
  if(menu) menu.hidden = true;
  if(btn) btn.setAttribute('aria-expanded','false');
}
function switchVehicle(id){
  if(id === activeId){ closeVehMenu(); return; }
  loadVehicle(id);
  closeVehMenu(); renderAll();
  toast(`Switched to ${vehicleLabel(bike)}`,'✓');
}

/* ==================================================================
   SETUP — add a vehicle, then the three slides
   ================================================================== */
let obStage = 'vehicle';   // 'vehicle' | 'slides'
let obSlide = 0;
let obDraft = null;        // the vehicle being filled in, or null when listing the garage
/* The same form serves first-run setup and "add a vehicle" from the switcher or
   Settings → Garage. This says which, because after setup there is no tour to
   continue into and no step counter to show. */
let obPost  = false;

const SLIDES = [
  { art:'onboarding/mileage.svg', title:'Your real mileage, per tank',
    body:'Every fill-up you log sharpens one number — what this vehicle actually returns per litre. Not a brochure figure.' },
  { art:'onboarding/range.svg',   title:'Know your range before you ride',
    body:'A tank gauge that counts down as you ride, the distance you drop onto reserve, and a nudge when the next fill is due.' },
  { art:'onboarding/garage.svg',  title:'Every vehicle, offline and private',
    body:'Keep a whole garage, track service and spending, and do it with no account and no signal. Nothing leaves your phone.' }
];

function startOnboarding(){
  obStage = 'vehicle'; obSlide = 0; obPost = false;
  obDraft = vehicles.length ? null : newVehicle();
  $('#ob').hidden = false;
  document.body.classList.add('locked');
  renderOb();
}
/** Add a vehicle once setup is behind you — same form, no tour after it. */
function addVehicleFlow(){
  obStage = 'vehicle'; obSlide = 0; obPost = true;
  obDraft = newVehicle();
  $('#ob').hidden = false;
  document.body.classList.add('locked');
  renderOb();
}
function closeOb(){
  $('#ob').hidden = true;
  document.body.classList.remove('locked');
  obPost = false; obDraft = null;
  renderAll(); updateFab();
}
function finishOnboarding(){
  DB.set(K.onboarded, true);
  track('setup_done', { vehicles: vehicles.length });
  $('#ob').hidden = true;
  document.body.classList.remove('locked');
  if(!activeId && vehicles.length) loadVehicle(vehicles[0].id);
  renderAll(); updateFab(); showView('dashboard');
}

function renderOb(){
  $('#ob-in').innerHTML = obStage === 'slides' ? obSlidesHTML() : (obDraft ? obFormHTML() : obGarageHTML());
  wireOb();
}

function obFormHTML(){
  const d = obDraft, t = vType(d);
  const brands = t.brands.map(b=>`<option value="${esc(b)}"></option>`).join('');
  const first = !obPost && vehicles.length === 0;

  return `
  <div class="ob-head">
    <div class="ob-step">${first?'Step 2 of 3':'Add a vehicle'}</div>
    <h2>${first?'What do you ride?':'What else do you ride?'}</h2>
    <p>Just what it is and what you call it. Tank size and the odometer come later, on the vehicle&rsquo;s own screen.</p>
  </div>
  <div class="ob-body">
    <div class="seg">
      <button type="button" aria-pressed="${d.type==='motorcycle'}" data-type="motorcycle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="3.2"/><circle cx="18.5" cy="17" r="3.2"/><path d="M5.5 17l4-8h5l3 5.5M9 9h6M14.5 9l2.5 5"/></svg>
        Motorcycle
      </button>
      <button type="button" aria-pressed="${d.type==='car'}" data-type="car">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13.5 4.8 8.4A2.4 2.4 0 0 1 7.06 6.8h9.88a2.4 2.4 0 0 1 2.26 1.6L21 13.5"/><path d="M3 13.5h18v3.9H3z"/><circle cx="7" cy="17.4" r="1.6"/><circle cx="17" cy="17.4" r="1.6"/></svg>
        Car
      </button>
    </div>

    <div class="field"><label>Brand</label>
      <input id="ob-brand" list="ob-brands" autocomplete="off" placeholder="${esc(t.brands[0])}" value="${esc(d.brand)}">
      <datalist id="ob-brands">${brands}</datalist>
    </div>

    <div class="field"><label>Model</label>
      <input id="ob-model" autocomplete="off" placeholder="${d.type==='car'?'Swift':'Classic 350'}" value="${esc(d.model)}">
    </div>

    <div class="field"><label>Colour <span style="color:var(--faint)">&middot; optional</span></label>
      <input id="ob-colour" autocomplete="off" maxlength="24" placeholder="${d.type==='car'?'Pearl white':'Racing red'}" value="${esc(d.colour&&d.colour.name||'')}">
    </div>

    <div class="field"><label>Name your vehicle <span style="color:var(--faint)">&middot; optional</span></label>
      <input id="ob-name" autocomplete="off" maxlength="28" placeholder="${d.type==='car'?'The runabout':'Weekend bike'}" value="${esc(d.name)}">
    </div>
  </div>
  <div class="ob-foot">
    ${(obPost || vehicles.length)?`<button class="btn-ghost" data-act="ob-back" type="button">${obPost?'Cancel':'Back'}</button>`:''}
    <span class="grow"></span>
    <button class="btn-pri" data-act="ob-save" type="button">Add to garage</button>
  </div>`;
}

function obGarageHTML(){
  const cards = vehicles.map(v=>`
    <div class="gcard">
      ${vehicleThumb(v)}
      <div class="gc-t">
        <div class="gc-n">${esc(vehicleLabel(v))}</div>
        <div class="gc-s">${[esc(vehicleSub(v)), esc((v.colour&&v.colour.name)||'')].filter(Boolean).join(' &middot; ')}</div>
      </div>
      <button class="gc-x" data-rm="${esc(v.id)}" type="button" aria-label="Remove ${esc(vehicleLabel(v))}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>`).join('');
  const n = vehicles.length;
  return `
  <div class="ob-head">
    <div class="ob-step">Step 2 of 3</div>
    <h2>Your garage</h2>
    <p>${n} vehicle${n===1?'':'s'} added. You can add more at any time from Settings.</p>
  </div>
  <div class="ob-body">
    ${cards}
    <button class="btn-ghost" data-act="ob-add" type="button" style="width:100%;margin-top:6px">+ Add another vehicle</button>
  </div>
  <div class="ob-foot">
    <span class="grow"></span>
    <button class="btn-pri" data-act="ob-slides" type="button">Continue</button>
  </div>`;
}

function obSlidesHTML(){
  const s = SLIDES[obSlide];
  const last = obSlide === SLIDES.length - 1;
  return `
  <div class="ob-body slide">
    <div class="slide-skip">${last?'':`<button class="btn-text" data-act="ob-skip" type="button">Skip</button>`}</div>
    <div class="slide-art"><img src="${esc(s.art)}" alt="" aria-hidden="true" onerror="this.style.display='none'"></div>
    <div class="ob-step">Step 3 of 3</div>
    <h3>${esc(s.title)}</h3>
    <p>${esc(s.body)}</p>
  </div>
  <div class="ob-foot slide-foot">
    <div class="dots">${SLIDES.map((_,i)=>`<i class="${i===obSlide?'on':''}"></i>`).join('')}</div>
    <button class="btn-pri" data-act="ob-next" type="button">${last?'Start logging':'Next'}</button>
  </div>`;
}

function wireOb(){
  const root = $('#ob-in');
  const readForm = ()=>{
    if(!obDraft) return;
    const b=$('#ob-brand'), m=$('#ob-model'), n=$('#ob-name'), c=$('#ob-colour');
    if(b) obDraft.brand = b.value.trim();
    if(m) obDraft.model = m.value.trim();
    if(n) obDraft.name  = n.value.trim();
    if(c){ const name=c.value.trim(); obDraft.colour = { name, hex: colourHex(name) }; }
  };

  root.querySelectorAll('[data-type]').forEach(el=> el.addEventListener('click',()=>{
    readForm(); obDraft.type = el.dataset.type; renderOb();
  }));
  root.querySelectorAll('[data-rm]').forEach(el=> el.addEventListener('click',()=>{
    const v = findVehicle(el.dataset.rm); if(!v) return;
    showModal('Remove this vehicle?', `${vehicleLabel(v)} and everything logged against it.`, 'Remove', ()=>{
      removeVehicle(v.id);
      obDraft = vehicles.length ? null : newVehicle();
      renderOb();
    });
  }));

  const act = a => root.querySelector(`[data-act="${a}"]`);
  const on = (a,fn)=>{ const el=act(a); if(el) el.addEventListener('click',fn); };

  on('ob-save', ()=>{
    readForm();
    if(!obDraft.brand || !obDraft.model){ toast('Brand and model, please','!'); return; }
    if(!obDraft.name) obDraft.name = `${obDraft.brand} ${obDraft.model}`.trim();
    const rec = addVehicle(obDraft);
    obDraft = null;
    if(obPost){
      /* added from inside the app: land on the thing you just added rather
         than leaving it buried in a list you have to go and find */
      loadVehicle(rec.id);
      closeOb();
      toast(`${vehicleLabel(rec)} added`,'✓');
      return;
    }
    renderOb();
    toast('Added to your garage','✓');
  });
  on('ob-add',    ()=>{ obDraft = newVehicle(); renderOb(); });
  on('ob-back',   ()=>{ obPost ? closeOb() : (obDraft = null, renderOb()); });
  on('ob-slides', ()=>{ obStage='slides'; obSlide=0; renderOb(); });
  on('ob-skip',   ()=> finishOnboarding());
  on('ob-next',   ()=>{
    if(obSlide === SLIDES.length-1){ finishOnboarding(); return; }
    obSlide++; renderOb();
  });
}

(function boot(){
  const started = Date.now();

  betaUserId();
  if(betaEnded()){
    // gate now from the cached/baked verdict; if the remote was extended since,
    // re-run boot with the fresh row rather than staying stopped
    showBetaEnded();
    refreshBetaConfig().then(()=>{ if(!betaEnded()) location.reload(); });
    return;
  }
  flushEvents();
  track('app_open', { vehicles: vehicles.length, storage: DB.ok });
  // a live pull can revoke access mid-beta; gate the moment it says so
  refreshBetaConfig().then(()=>{ if(betaEnded()) showBetaEnded(); });

  if(activeId || vehicles.length) loadVehicle(activeId || vehicles[0].id);
  renderAll();
  updateFab();
  bioCapable().then(()=>{ if(!$('#lock').hidden || hasPin()) renderSettings(); });

  lockStep = hasPin() ? entryStep() : 'create';
  renderLock();

  const reveal = ()=>{
    $('#lock').hidden = false;
    const b = $('#boot');
    b.classList.add('gone');
    setTimeout(()=> b.remove(), 520);
    // the sensor asks for itself — no reaching for anything
    if(lockStep === 'sensor') setTimeout(()=> tryBio(true), 300);
  };
  setTimeout(reveal, Math.max(0, 800 - (Date.now() - started)));
})();
</script>
